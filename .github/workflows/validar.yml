name: Validar

on:
  pull_request:
    paths:
      - "dados/**"
      - "schema/**"
      - "scripts/**"
      - "package.json"
      - "METODOLOGIA.md"
      - "claude/metodologia.md"

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
      - run: npm run validar
      - name: Verificar espelho da metodologia
        run: diff METODOLOGIA.md claude/metodologia.md
