id: fosseis-de-jebel-irhoud
tipo: objeto
nome: Fósseis de Jebel Irhoud
alias: []
descricao: >-
  Fósseis humanos achados no sítio de Jebel Irhoud, no Marrocos: crânios,
  mandíbula, dentes e ossos de pelo menos cinco indivíduos, com o rosto já
  parecido com o do ser humano atual e o crânio mais arcaico.
