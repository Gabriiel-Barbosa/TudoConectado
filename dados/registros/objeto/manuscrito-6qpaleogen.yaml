id: manuscrito-6qpaleogen
tipo: objeto
nome: 6QpaleoGen
alias: ["6Q1"]
descricao: >
  Fragmento de um manuscrito antigo com o texto de Gênesis 6:13–21. Foi
  encontrado na Gruta 6 de Qumran, sítio junto ao Mar Morto, e está em
  escrita paleo-hebraica (a escrita hebraica antiga, anterior à
  quadrada). O nome resume isso: 6 é a gruta, Q é Qumran, paleo indica a
  escrita e Gen abrevia Gênesis. Pelo estilo da letra (datação
  paleográfica), o fragmento foi datado entre o século III e o início do
  século II a.C. (c. 250–150 a.C.). Segundo Crawford (2012), é a cópia
  mais antiga de Gênesis entre os manuscritos do Mar Morto, os textos
  antigos achados nas grutas da região.
