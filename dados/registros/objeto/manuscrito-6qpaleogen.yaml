id: manuscrito-6qpaleogen
tipo: objeto
nome: 6QpaleoGen
alias: ["6Q1"]
descricao: >
  Fragmento de Gênesis 6:13–21 em escrita paleo-hebraica, encontrado na
  Gruta 6 de Qumran e datado paleograficamente entre o século III e o
  início do século II a.C. (~250–150 a.C.). Segundo Crawford (2012), é a
  cópia mais antiga de Gênesis entre os manuscritos do Mar Morto.
