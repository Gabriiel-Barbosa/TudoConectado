id: talmude-babilonico
tipo: texto
nome: Talmude Babilônico
alias: [Bavli]
descricao: >
  Grande coletânea de debates entre rabinos, os mestres da lei judaica.
  Foi redigida ao longo de séculos na Babilônia (região do atual Iraque)
  e concluída por volta dos séculos VI e VII d.C. Nesses debates, os
  rabinos discutem a Mishná (uma compilação mais antiga da lei oral
  judaica) e a tradição legal judaica como um todo. A obra se divide em
  partes chamadas tratados. Um deles, Bava Batra, trata, entre outros
  temas, de quem a tradição aponta como autor dos livros da Bíblia.
