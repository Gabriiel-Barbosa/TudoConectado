id: talmude-babilonico
tipo: texto
nome: Talmude Babilônico
alias: [Bavli]
descricao: >
  Grande coletânea de debates entre rabinos, os mestres da lei judaica.
  Eles discutem a Mishná (uma compilação mais antiga da lei oral judaica)
  e a tradição legal judaica como um todo. O texto foi redigido ao longo
  de séculos na Babilônia (região do atual Iraque) e concluído por volta
  dos séculos VI e VII d.C. A obra se divide em partes chamadas tratados.
  Um deles, Bava Batra, discute, entre outros temas, quem a tradição
  aponta como autor dos livros da Bíblia.
