id: talmude-babilonico
tipo: texto
nome: Talmude Babilônico
alias: [Bavli]
descricao: >
  Compilação de discussões rabínicas sobre a Mishná e a tradição legal
  judaica, redigida ao longo de séculos e finalizada por volta do século
  VI–VII d.C. na Babilônia. O tratado Bava Batra discute, entre outros
  temas, a autoria tradicional dos livros bíblicos.
