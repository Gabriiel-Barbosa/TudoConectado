id: hipotese-documentaria
tipo: texto
nome: Hipótese Documentária (JEDP)
alias: [Documentary Hypothesis]
descricao: >
  Explicação acadêmica de como foram escritos os cinco primeiros livros
  da Bíblia (o Pentateuco, de Gênesis a Deuteronômio). Segundo ela, esses
  livros não saíram das mãos de um único autor. Eles juntam quatro textos
  distintos, que foram reunidos e editados ao longo de séculos. Os
  estudiosos chamam esses textos de "fontes" e dão a cada um um nome e
  uma letra: Javista (J), Eloísta (E), Sacerdotal (P, do inglês Priestly)
  e Deuteronomista (D), daí a sigla JEDP. Julius Wellhausen formalizou a
  hipótese num livro de 1878, que reeditou em 1883, e estudiosos
  posteriores, como Joel S. Baden (2012), a revisaram.
