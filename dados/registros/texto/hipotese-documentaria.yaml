id: hipotese-documentaria
tipo: texto
nome: Hipótese Documentária (JEDP)
alias: [Documentary Hypothesis]
descricao: >
  Teoria de crítica bíblica segundo a qual o Pentateuco resulta da
  combinação de quatro fontes distintas — Javista (J), Eloísta (E),
  Sacerdotal (P) e Deuteronomista (D) — compiladas e editadas ao longo de
  séculos, em vez de escritas por um único autor. Formalizada por Julius
  Wellhausen em 1878/1883 e revisada por estudiosos posteriores, como Joel
  S. Baden.
