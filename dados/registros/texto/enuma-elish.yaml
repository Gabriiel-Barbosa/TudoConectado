id: enuma-elish
tipo: texto
nome: Enuma Elish
alias:
  - Enūma eliš
descricao: >-
  Poema babilônico sobre a origem do mundo, escrito em acádio em sete
  tabuletas de argila. Conta como o deus Marduk vence Tiamat, a
  personificação das águas primordiais, parte o corpo dela em dois e faz de
  uma das metades o céu. As cópias mais antigas conhecidas são de c. 1000
  a.C.; a data em que o poema foi composto é discutida pelos estudiosos.
