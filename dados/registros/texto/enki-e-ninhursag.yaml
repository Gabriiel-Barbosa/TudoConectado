id: enki-e-ninhursag
tipo: texto
nome: Enki e Ninhursag
alias: []
descricao: >-
  Mito sumério ambientado em Dilmun, uma terra pura, sem doença nem morte.
  Quando o deus Enki adoece depois de comer plantas proibidas, a deusa
  Ninhursag faz nascer uma divindade curadora para cada parte doente do
  corpo dele.
