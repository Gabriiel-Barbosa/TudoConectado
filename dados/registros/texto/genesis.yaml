id: genesis
tipo: texto
nome: Gênesis
alias: [Bereshit, Bereshith]
descricao: >
  Primeiro livro da Bíblia, tanto na Bíblia judaica quanto na cristã.
  Abre a Torá, também chamada de Pentateuco: o conjunto dos cinco
  primeiros livros bíblicos, de Gênesis a Deuteronômio. Em 50 capítulos,
  Gênesis conta uma história que começa na criação do mundo e termina
  com a morte de José (filho de Jacó) no Egito. O nome hebraico do livro,
  Bereshit ("No princípio"), vem da primeira palavra do texto.
