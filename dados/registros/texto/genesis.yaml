id: genesis
tipo: texto
nome: Gênesis
alias: [Bereshit, Bereshith]
descricao: >
  Primeiro livro da Torá/Pentateuco e da Bíblia hebraica e cristã, com 50
  capítulos, cobrindo da criação do mundo até a morte de José no Egito.
  O nome hebraico "Bereshit" ("No princípio") vem da primeira palavra do
  texto.
