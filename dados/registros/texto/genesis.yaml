id: genesis
tipo: texto
nome: Gênesis
alias: [Bereshit, Bereshith]
descricao: >
  Primeiro livro da Bíblia, tanto na judaica quanto na cristã. Abre a
  Torá, também chamada de Pentateuco: o conjunto dos cinco primeiros
  livros bíblicos, de Gênesis a Deuteronômio. Seus 50 capítulos vão da
  criação do mundo até a morte de José (filho de Jacó) no Egito. O nome
  hebraico do livro, Bereshit ("No princípio"), vem da primeira palavra
  do texto.
