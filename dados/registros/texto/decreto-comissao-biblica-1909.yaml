id: decreto-comissao-biblica-1909
tipo: texto
nome: Decreto da Pontifícia Comissão Bíblica (1909)
alias: []
descricao: >-
  Respostas oficiais da Pontifícia Comissão Bíblica, órgão do Vaticano para
  questões de interpretação da Bíblia, sobre o caráter histórico dos três
  primeiros capítulos de Gênesis. Foram publicadas em 1909 na Acta
  Apostolicae Sedis, o boletim oficial da Santa Sé.
