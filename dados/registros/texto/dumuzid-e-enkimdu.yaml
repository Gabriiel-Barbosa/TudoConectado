id: dumuzid-e-enkimdu
tipo: texto
nome: Dumuzid e Enkimdu
alias: [Inanna prefere o fazendeiro]
descricao: >
  Poema sumério de disputa em que Dumuzid, o deus pastor, e Enkimdu, o deus
  lavrador, competem pelo favor da deusa Inanna. Dumuzid é quem provoca a
  briga, perguntando em que o lavrador lhe seria superior. O poema termina em
  reconciliação, sem que nenhum dos dois morra. O corpus de literatura
  suméria a que pertence é datado, de modo geral, do fim do terceiro e início
  do segundo milênio a.C.; a edição de Oxford não dá data própria para este
  poema.
