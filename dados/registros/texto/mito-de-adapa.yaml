id: mito-de-adapa
tipo: texto
nome: Mito de Adapa
alias: [Adapa e o vento sul]
descricao: >
  Relato acadiano, conhecido por tabuinhas de argila achadas em Amarna, no
  Egito, e na biblioteca de Assurbanípal, em Nínive. Conta como Adapa,
  sábio e sacerdote de Ea, quebra a asa do vento sul e é chamado à presença
  do deus Anu. Ea o instrui a recusar a comida e a bebida que lhe forem
  oferecidas, dizendo que são de morte; Adapa obedece, e assim perde o que
  lhe era oferecido — a vida sem fim.
