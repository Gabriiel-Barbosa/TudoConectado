id: textos-das-piramides-e-dos-sarcofagos
tipo: texto
nome: Textos das Pirâmides e dos Sarcófagos
alias: []
descricao: >-
  Conjuntos de textos religiosos do antigo Egito, gravados nas pirâmides do
  Antigo Império e escritos em sarcófagos do Médio Império. Entre outras
  coisas, contam como o mundo surgiu das águas primordiais e como o céu foi
  mantido afastado da terra e dessas águas.
