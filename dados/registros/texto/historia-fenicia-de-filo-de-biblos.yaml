id: historia-fenicia-de-filo-de-biblos
tipo: texto
nome: História Fenícia de Filo de Biblos
alias: [Sanchuniathon, Sanchuniáton]
descricao: >
  Obra de Filo de Biblos, por volta do ano 100, que se apresenta como
  tradução de um autor fenício muito mais antigo, Sanchuniathon. O original
  se perdeu: o que existe são trechos citados por Eusébio de Cesareia na
  "Preparação Evangélica", do início do século IV. Entre esses trechos há uma
  genealogia que atribui a origem de ofícios e invenções a descendentes
  sucessivos, no mesmo formato da lista de Gênesis 4:20-22.
