id: sete
tipo: pessoa
nome: Sete
alias: [Shet]
descricao: >
  O terceiro filho de Adão e Eva nomeado em Gênesis 4, nascido depois da
  morte de Abel. O texto explica o nome pela fala da mãe: Deus lhe
  "substituiu outra descendência em lugar de Abel". É por ele que segue a
  linhagem retomada em Gênesis 5.
