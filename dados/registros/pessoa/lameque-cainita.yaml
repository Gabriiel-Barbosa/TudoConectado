id: lameque-cainita
tipo: pessoa
nome: Lameque (da linhagem de Caim)
alias: [Lameque, Lemech]
descricao: >
  Quinto descendente de Caim, segundo Gênesis 4:18-24. É o primeiro homem
  que o texto apresenta com duas mulheres, Ada e Zilá, e o autor do canto
  em que se gaba de ter matado um homem que o feriu e promete uma vingança
  muito maior que a de Caim. Não é o Lameque de Gênesis 5:28, pai de Noé,
  da linhagem de Sete.
