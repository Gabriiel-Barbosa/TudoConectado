id: caim
tipo: pessoa
nome: Caim
alias: [Qayin]
descricao: >
  O primeiro filho de Adão e Eva, segundo Gênesis 4, e lavrador da terra.
  Sua oferta do fruto da terra não é aceita, a do irmão Abel é, e ele mata
  o irmão no campo. Condenado a ser "errante e fugitivo na terra", recebe
  de Deus um sinal que o protege de ser morto, vai habitar na terra de Node
  e edifica a primeira cidade que o texto menciona.
