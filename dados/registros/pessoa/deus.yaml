id: deus
tipo: pessoa
nome: Deus
alias: [Elohim, YHWH]
descricao: >
  Em Gênesis 1, o criador de tudo o que existe, que faz o mundo pela
  palavra ao longo de seis dias. O texto hebraico deste capítulo o chama de
  Elohim. Em outros trechos da Bíblia hebraica, o deus de Israel também é
  chamado pelo nome próprio YHWH.
