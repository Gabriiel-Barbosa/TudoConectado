id: tubalcaim
tipo: pessoa
nome: Tubalcaim
alias: [Tubal-Caim]
descricao: >
  Filho de Lameque e Zilá, apresentado em Gênesis 4:22 como "feitor de toda
  obra de bronze e de ferro" — isto é, como origem da metalurgia. Ao lado
  de Jabal e Jubal, forma o trio a quem o capítulo atribui a origem de três
  ofícios.
