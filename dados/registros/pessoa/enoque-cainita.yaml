id: enoque-cainita
tipo: pessoa
nome: Enoque (filho de Caim)
alias: [Enoque, Hanoch]
descricao: >
  Filho de Caim, segundo Gênesis 4:17, e nome da primeira cidade que o
  texto registra, edificada pelo pai. Não é o Enoque de Gênesis 5:24, da
  linhagem de Sete, que "andou com Deus" — as duas linhagens repetem vários
  nomes parecidos, e este registro é o da linhagem de Caim.
