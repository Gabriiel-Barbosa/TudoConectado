id: ser-humano
tipo: pessoa
nome: Ser humano
alias: [macho e fêmea]
descricao: >
  Em Gênesis 1, a humanidade que Deus cria no sexto dia, homem e mulher, à
  sua imagem e semelhança, e a quem dá domínio sobre os peixes, as aves e
  os animais da terra. O texto não dá nome a ninguém: Adão e Eva só
  aparecem, com nome, nos capítulos seguintes.
