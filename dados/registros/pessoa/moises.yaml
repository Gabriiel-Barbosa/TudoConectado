id: moises
tipo: pessoa
nome: Moisés
alias: []
descricao: >
  Segundo a tradição judaico-cristã, autor do Pentateuco (incluindo
  Gênesis). Figura central do livro de Êxodo. Sua existência histórica e a
  autoria mosaica do Pentateuco são disputadas pela crítica bíblica
  acadêmica moderna (ver hipotese-documentaria).
