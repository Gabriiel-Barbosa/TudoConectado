id: moises
tipo: pessoa
nome: Moisés
alias: []
descricao: >
  Personagem bíblico, figura central do livro de Êxodo, o segundo livro
  da Bíblia. Segundo a tradição judaica e cristã, foi Moisés quem
  escreveu o Pentateuco (os cinco primeiros livros da Bíblia), incluindo
  Gênesis. A crítica bíblica acadêmica moderna estuda a Bíblia com os
  métodos da história e da análise de textos. Nela, estão em disputa
  tanto a existência histórica de Moisés quanto a autoria do Pentateuco
  que a tradição lhe atribui (ver Hipótese Documentária).
