id: moises
tipo: pessoa
nome: Moisés
alias: []
descricao: >
  Personagem bíblico, figura central do livro de Êxodo, o segundo livro
  da Bíblia. Segundo a tradição judaica e cristã, foi ele quem escreveu o
  Pentateuco (os cinco primeiros livros da Bíblia), incluindo Gênesis. A
  crítica bíblica acadêmica moderna, que estuda a Bíblia com os métodos
  da história e da análise de textos, põe em disputa as duas coisas: que
  Moisés tenha existido historicamente e que tenha escrito o Pentateuco
  (ver Hipótese Documentária).
