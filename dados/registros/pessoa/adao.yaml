id: adao
tipo: pessoa
nome: Adão
alias: [homem]
descricao: >
  O primeiro homem, segundo Gênesis 2: Deus o forma do pó da terra, sopra
  nele o fôlego de vida e o põe no jardim do Éden para cultivá-lo e
  guardá-lo. No capítulo 2, o texto o chama primeiro de "o homem" e, a
  partir do versículo 19, de Adão. Em hebraico, adam também quer dizer
  "ser humano".
