id: serpente
tipo: pessoa
nome: Serpente
alias: [nachash]
descricao: >
  O animal que, em Gênesis 3, convence a mulher a comer da árvore proibida.
  O texto a apresenta como "astuta, mais que todos os animais do campo que
  o SENHOR Deus havia feito" — isto é, como uma criatura entre as outras, e
  não como um ser sobrenatural. Gênesis 3 não a identifica com Satanás: essa
  leitura aparece depois, fora do capítulo.
