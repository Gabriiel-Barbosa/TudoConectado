o_que_derrubaria: >-
  O paralelo entre o Enuma Elish e Gênesis 1 cairia se uma nova leitura das
  tabuletas mostrasse que as semelhanças apontadas, como as águas
  primordiais divididas para formar o céu e a mesma ordem dos
  acontecimentos, não estão no texto babilônico ou dependem de trechos mal
  reconstituídos.
notas: >-
  Paralelo não quer dizer cópia. Heidel (1951), que lista as semelhanças,
  vê pela ordem dos acontecimentos uma relação de parentesco entre as duas
  histórias, mas deixa em aberto se o relato bíblico depende do material
  babilônico. Para Routledge (2010), é amplamente reconhecido que nada
  indica dependência, e Millard (1967) diz que ainda não se mostrou
  empréstimo algum. A data em que o Enuma Elish foi composto também é
  discutida, o que impede dizer qual dos dois textos é mais antigo. Heidel
  observa ainda que as diferenças vão mais fundo que as semelhanças: no
  poema babilônico, o mundo nasce da luta de um deus contra outro.
