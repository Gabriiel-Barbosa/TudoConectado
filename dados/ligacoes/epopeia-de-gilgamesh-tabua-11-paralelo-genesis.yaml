id: epopeia-de-gilgamesh-tabua-11-paralelo-genesis
tipo: paralelo
entre:
  - registro: epopeia-de-gilgamesh
  - registro: genesis
evidencia:
  tipo_de_apoio: texto
  forca: aceito_maioria
  quem_sustenta:
    - nome: James George Frazer
      ano: 1918
    - nome: E. A. Speiser
      ano: 1964
fontes:
  - nivel: 2
    descricao: >-
      Speiser, E. A. (1964), Genesis: Introduction, Translation, and Notes
      (The Anchor Bible, vol. 1), Garden City, NY: Doubleday, p. 28
  - nivel: 3
    descricao: >-
      Frazer, J. G. (1918), Folk-lore in the Old Testament: Studies in
      Comparative Religion, Legend and Law, vol. 1, Londres: Macmillan,
      pp. 50–52
    url: https://archive.org/details/folkloreinoldtes01fraz_1
o_que_derrubaria: >-
  O paralelo cairia se a tábua XI mostrasse que não é uma serpente que leva
  a planta de Gilgamesh, ou que a planta nada tem a ver com prolongar a
  vida.
notas: >-
  Na tábua XI, Gilgamesh consegue uma planta que devolve a juventude e a
  perde para uma serpente enquanto se banha. A imagem de uma serpente que
  tira do ser humano o que prolongaria a vida é parecida com a de Gênesis
  3, mas a diferença importa: a planta do poema rejuvenesce, não torna
  imortal, e Speiser faz questão dessa distinção. Ele também diz que a
  fonte específica e o caminho de transmissão permanecem incertos. Frazer
  descreve o episódio em detalhe, mas a reconstrução que ele propõe do mito
  original é hipótese declarada — ele mesmo escreve que os paralelos
  sugerem, sem poder provar. Por isso a ligação é de tipo paralelo, e a
  fonte de Frazer entra em nível 3: é obra de 1918, de método comparativo
  hoje superado, e serve para descrever o episódio, não para sustentar
  dependência.
