id: estela-de-mesa-confirma-nome-yhwh-fora-da-biblia
tipo: confirma
entre:
  - registro: estela-de-mesa
  - afirmacao: nome-yhwh-fora-da-biblia
evidencia:
  tipo_de_apoio: inscricao
  forca: bem_estabelecido
  quem_sustenta:
    - nome: "Gary A. Rendsburg"
      ano: 2007
fontes:
  - nivel: 1
    descricao: "Estela de Mesa, Museu do Louvre, Departamento de Antiguidades Orientais, AO 5066 (ficha do objeto: inscrição de 34 linhas, gravada pouco depois de 842 a.C.)"
    url: "https://collections.louvre.fr/en/ark:/53355/cl010120339"
  - nivel: 2
    descricao: "Rendsburg, G. A. (2007), \"bʿaw in Mesha Stele, Line 12\", Maarav 14.1, pp. 9–25 (transliteração e tradução das linhas 17–18 na p. 22)"
    url: "https://jewishstudies.rutgers.edu/images/documents/faculty/Rendsburg/Maarav_Mesha_Stele_line12.pdf"
o_que_derrubaria: >
  A ideia de que a Estela de Mesa já usa o nome YHWH cairia se uma nova
  leitura da pedra mostrasse que as letras das linhas 17 e 18 não formam
  esse nome, ou se a estela fosse de outra época ou uma falsificação.
notas: >
  A estela é do rei de Moabe, um vizinho e inimigo de Israel, e não de um
  israelita: é por isso que ela conta como testemunho de fora da Bíblia. O
  que ela comprova é que, no século IX a.C., o deus de Israel era conhecido
  pelo nome YHWH, a ponto de um rei estrangeiro se gabar de ter tomado os
  vasos do seu culto. Ela não diz nada sobre Gênesis 1 nem sobre a crença
  em si. Uma palavra dessa passagem, "vasos", está danificada na pedra e é
  uma restauração, aceita, segundo Rendsburg (2007), por quase todos os
  estudiosos.
