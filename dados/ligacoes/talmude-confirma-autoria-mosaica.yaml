id: talmude-confirma-autoria-mosaica
tipo: confirma
entre:
  - registro: talmude-babilonico
  - afirmacao: autoria-mosaica-genesis
evidencia:
  tipo_de_apoio: texto
  forca: aceito_maioria
  quem_sustenta: []
fontes:
  - nivel: 1
    descricao: "Talmude Babilônico, tratado Bava Batra, fólios 14b–15a"
o_que_derrubaria: >
  O apoio que o Talmude Babilônico dá à ideia de que Moisés escreveu
  Gênesis cairia se surgisse evidência de que a atribuição a Moisés no
  Talmude é uma tradição tardia, sem apoio em nenhum registro anterior.
  Também cairia se houvesse evidência de que os próprios sábios citados
  na passagem nunca estiveram, de fato, de acordo sobre a autoria de
  Moisés.
notas: >
  No Talmude Babilônico, a grande coletânea de debates dos rabinos (os
  mestres da lei judaica), o tratado Bava Batra traz nos fólios 14b–15a
  uma baraita, isto é, um ensinamento rabínico antigo que o Talmude
  cita. Essa baraita atribui a Moisés “seu livro”, a Torá (os cinco
  primeiros livros da Bíblia), além da porção de Balaão e do livro de
  Jó. Gênesis não aparece pelo nome. Ele entra na atribuição por fazer
  parte da Torá. A mesma passagem atribui a Josué os oito últimos
  versículos da Torá, o que não afeta Gênesis. O apoio do Talmude aparece
  aqui como aceito pela maioria, e essa classificação mede a adesão à
  atribuição a Moisés dentro da tradição rabínica, a dos mestres judeus
  cujas discussões formam o Talmude. Ela não avalia se, do ponto de
  vista histórico, Moisés escreveu Gênesis. Essa questão fica com a
  ligação entre a Hipótese Documentária e a autoria de Moisés. Por
  enquanto, o apoio do Talmude se sustenta só na fonte primária, o
  próprio texto talmúdico. Falta uma obra acadêmica que comente a
  passagem, com a página indicada; esse ponto está pendente de
  conferência.
