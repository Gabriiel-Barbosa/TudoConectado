id: talmude-confirma-autoria-mosaica
tipo: confirma
entre:
  - afirmacao: autoria-mosaica-genesis
  - registro: talmude-babilonico
evidencia:
  tipo_de_apoio: texto
  forca: aceito_maioria
  quem_sustenta: []
fontes:
  - nivel: 1
    descricao: "Talmude Babilônico, tratado Bava Batra, fólios 14b–15a"
o_que_derrubaria: >
  Esta ligação cairia se surgisse evidência de que a atribuição a Moisés
  no Talmude é uma tradição tardia, sem apoio em nenhum registro
  anterior. Também cairia se houvesse evidência de que os próprios sábios
  citados na passagem nunca estiveram, de fato, de acordo sobre a autoria
  de Moisés.
notas: >
  A classificação desta ligação como aceita pela maioria mede a adesão à
  atribuição a Moisés dentro da tradição rabínica, a dos mestres judeus
  cujas discussões formam o Talmude. Ela não avalia se, do ponto
  de vista histórico, Moisés escreveu Gênesis. Essa questão fica com a
  ligação entre a Hipótese Documentária e a autoria de Moisés. Quanto ao
  que a passagem diz: uma baraita (ensinamento rabínico antigo que o
  Talmude cita) no tratado Bava Batra, fólios 14b–15a, atribui a Moisés
  “seu livro”, isto é, a Torá (os cinco primeiros livros da Bíblia), além
  da porção de Balaão e do livro de Jó. Gênesis não aparece pelo nome.
  Ele entra na atribuição por fazer parte da Torá. A mesma passagem
  atribui a Josué os oito últimos versículos da Torá, o que não afeta
  Gênesis. Por enquanto, a ligação se apoia só na fonte primária, o
  próprio Talmude. Falta uma obra acadêmica que comente a passagem, com a
  página indicada; esse ponto está pendente de conferência.
