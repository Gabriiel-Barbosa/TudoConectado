id: amuletos-de-ketef-hinnom-confirma-nome-yhwh-fora-da-biblia
tipo: confirma
entre:
  - registro: amuletos-de-ketef-hinnom
  - afirmacao: nome-yhwh-fora-da-biblia
evidencia:
  tipo_de_apoio: inscricao
  forca: aceito_maioria
  quem_sustenta:
    - nome: "Erik Waaler"
      ano: 2002
fontes:
  - nivel: 2
    descricao: "Waaler, E. (2002), \"A Revised Date for Pentateuchal Texts? Evidence from Ketef Hinnom\", Tyndale Bulletin 53.1, pp. 29 e 35, doi:10.53751/001c.30240"
    url: "https://www.tyndalebulletin.org/article/30240-a-revised-date-for-pentateuchal-texts-evidence-from-ketef-hinnom.pdf"
o_que_derrubaria: >
  A ideia de que os amuletos de Ketef Hinnom trazem o nome YHWH cairia se
  uma nova leitura das duas placas de prata mostrasse que as letras lidas
  como esse nome dizem outra coisa.
notas: >
  Os amuletos são pequenos objetos pessoais, enterrados com os mortos, e
  trazem uma forma abreviada da bênção sacerdotal de Números 6:24–26, com o
  nome YHWH repetido. Eles comprovam o uso do nome e dessa bênção, mas não
  dizem nada sobre Gênesis 1. A data é discutida: Waaler (2002) os põe
  entre 725 e 650 a.C., e outros estudiosos, mais tarde. O número de
  catálogo no Museu de Israel, onde estão expostos, ainda não foi
  conferido.
