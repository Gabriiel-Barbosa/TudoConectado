o_que_derrubaria: >-
  O paralelo cairia se a leitura dos trechos preservados por Eusébio
  mostrasse que a genealogia fenícia não atribui a origem de ofícios a
  descendentes sucessivos, ou que o formato de lista genealógica ligada à
  origem da civilização não é o mesmo de Gênesis 4:20-22.
notas: >-
  O que as duas fontes afirmam é semelhança de gênero, não dependência.
  Gunkel compara a árvore genealógica de inventores de Gênesis 4:19-22 com
  os sistemas fenícios de história da cultura em forma de genealogia, e
  conclui que Israel não parece ter chegado a um sistema tão completo quanto
  o fenício. O volume consultado é a quinta impressão, de 1922, que a folha
  de rosto declara inalterada e que reproduz o prefácio da terceira edição,
  de 1910 — ou seja, o texto é o de 1910, e a paginação é a mesma. A
  referência foi corrigida na conferência: o catálogo do Internet Archive
  data o exemplar de 1902, o que levaria a citar a primeira edição, mas a
  folha de rosto do próprio volume desmente a data. Westermann é mais entusiasmado — diz que quase
  toda frase de Gênesis 1-11 que tenha a ver com a origem da civilização tem
  contrapartida no texto de Sanchuniathon — mas fala em contrapartidas e
  pontos de contato, nunca em cópia, e pondera ele mesmo que ali é provável
  que se combinem duas tradições diferentes. Há uma razão cronológica decisiva
  para o tipo ser paralelo e jamais foi_copiado_de: o texto fenício só existe
  na forma em que Filo de Biblos o escreveu, por volta do ano 100, citado por
  Eusébio no início do século IV — muito posterior a Gênesis. A anterioridade
  que a metodologia exige não existe nessa direção, e a semelhança é de
  estrutura e de gênero, não de palavras. Westermann aponta ainda um segundo
  ponto de contato, com as listas mesopotâmicas dos sete apkallu, os sábios
  anteriores ao dilúvio (p. 324), inclusive em detalhe: de um desses apkallu
  se diz que teria inventado a lira, ao lado de Jubal como pai dos que manejam
  harpa e flauta. Esse segundo ponto fica registrado aqui na nota, e não como
  ligação própria, porque as listas de apkallu não foram lidas em edição
  acadêmica — só através de Westermann.
