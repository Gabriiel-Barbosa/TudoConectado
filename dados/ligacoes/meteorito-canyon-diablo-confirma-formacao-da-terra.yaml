id: meteorito-canyon-diablo-confirma-formacao-da-terra
tipo: confirma
entre:
  - registro: meteorito-canyon-diablo
  - afirmacao: formacao-da-terra
evidencia:
  tipo_de_apoio: medicao_cientifica
  forca: bem_estabelecido
  quem_sustenta:
    - nome: G. Brent Dalrymple
      ano: 2001
fontes:
  - nivel: 2
    descricao: >-
      U.S. Geological Survey (2007), Geologic Time, página "Age of the
