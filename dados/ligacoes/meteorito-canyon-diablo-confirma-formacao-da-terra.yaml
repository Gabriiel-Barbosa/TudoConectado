o_que_derrubaria: >-
  A idade de 4,54 bilhões de anos cairia se se mostrasse que o decaimento
  radioativo não ocorre em ritmo constante, ou que o chumbo dos meteoritos
  não serve de referência para o da Terra.
notas: >-
  A idade vem do decaimento de elementos radioativos em rochas e meteoritos:
  o chumbo do meteorito Canyon Diablo é comparado ao de minérios terrestres
  antigos. Segundo Dalrymple (2001), o primeiro cálculo válido foi feito por
  Patterson em 1953, e o valor usado hoje, 4,54 bilhões de anos, é o de
  Tera, de 1980. Para Gênesis 1, que põe a criação da terra e a dos astros
  na mesma semana, a medição situa a Terra quase nove bilhões de anos depois
  do começo do universo; essa diferença é conta nossa, a partir desta
  medição e da missão Planck.
