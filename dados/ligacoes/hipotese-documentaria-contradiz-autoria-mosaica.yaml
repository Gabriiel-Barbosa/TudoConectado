o_que_derrubaria: >
  A objeção da Hipótese Documentária à ideia de que Moisés escreveu
  Gênesis cairia se a análise da língua ou do estilo trouxesse evidência
  de um único autor para todo o Pentateuco (os cinco primeiros livros da
  Bíblia). Essa evidência teria de ser incompatível com a divisão do
  texto nas quatro fontes que a hipótese propõe, chamadas J, E, P e D. A
  objeção também cairia se os estudiosos chegassem a um consenso que
  revertesse ou abandonasse a Hipótese Documentária.
notas: >
  Julius Wellhausen (1883) e, mais tarde, Joel S. Baden (2012)
  sustentaram a Hipótese Documentária. Segundo ela, o Pentateuco (os
  cinco primeiros livros da Bíblia) junta quatro fontes, chamadas J, E, P
  e D, em vez de ter um único autor, o que contradiz a atribuição a
  Moisés. Essa contestação aparece aqui como aceita pela maioria. A
  maioria, no caso, é a dos estudiosos da crítica bíblica acadêmica, que
  examinam os textos bíblicos com métodos históricos. Isso não quer dizer
  que haja o mesmo acordo nas comunidades religiosas que seguem a
  tradição de atribuir o texto a Moisés.
