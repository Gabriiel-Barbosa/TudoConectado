o_que_derrubaria: >-
  O paralelo entre o Atrahasis e Gênesis 2 cairia se uma nova leitura das
  tabuinhas mostrasse que o ser humano não é formado de barro nesse poema.
notas: >-
  No Atrahasis, o ser humano é formado de barro misturado à carne e ao
  sangue de um deus abatido. Em Gênesis 2, do pó da terra, com o sopro de
  Deus. Millard (1967) observa que os dois relatos dão ao homem uma parte
  terrena e uma parte divina, mas lembra que ideias parecidas não precisam
  ter a mesma origem: a de que o homem é feito de terra podia surgir em
  culturas diferentes, de forma independente. Paralelo, aqui, não quer dizer
  cópia.
