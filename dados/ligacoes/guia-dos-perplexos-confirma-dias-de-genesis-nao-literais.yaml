o_que_derrubaria: >-
  A ideia de que Maimônides lê os dias de forma não literal cairia se o
  capítulo II.30 tratasse os seis dias como seis atos de criação separados
  no tempo.
notas: >-
  Maimônides lê o começo de Gênesis como a criação de todas as coisas de uma
  vez, separadas depois, umas das outras, pouco a pouco. Para explicar,
  repete uma comparação dos sábios judeus: sementes de vários tipos semeadas
  no mesmo dia brotam em dias diferentes.
