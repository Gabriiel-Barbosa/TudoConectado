id: 6qpaleogen-confirma-genesis
tipo: confirma
entre:
  - registro: manuscrito-6qpaleogen
  - registro: genesis
evidencia:
  tipo_de_apoio: achado_arqueologico
  forca: bem_estabelecido
  quem_sustenta:
    - nome: "Sidnie White Crawford"
      ano: 2012
fontes:
  - nivel: 1
    descricao: "Dead Sea Scrolls Digital Library (Israel Antiquities Authority), manuscrito 6Q1 (6QpaleoGen)"
    url: "https://www.deadseascrolls.org.il/explore-the-archive/manuscript/6Q1-1"
  - nivel: 2
    descricao: "Crawford, Sidnie White (2012), 'Genesis in the Dead Sea Scrolls', em Craig A. Evans, Joel N. Lohr e David L. Petersen (orgs.), The Book of Genesis: Composition, Reception, and Interpretation (Supplements to Vetus Testamentum 152), Brill, pp. 353–373 (6QpaleoGen na p. 353), doi:10.1163/9789004226579_016"
    url: "https://doi.org/10.1163/9789004226579_016"
o_que_derrubaria: >
  A ideia de que o fragmento 6QpaleoGen é uma cópia antiga de Gênesis
  cairia em dois casos. Um deles seria uma nova análise paleográfica (a
  datação pelo estilo da letra) que empurrasse o fragmento para um
  período bem posterior. O outro seria a evidência de que o texto do
  6QpaleoGen se afasta tanto de Gênesis 6 que já não dá para tratá-lo
  como o mesmo livro.
notas: >
  O 6QpaleoGen é um fragmento com um trecho de Gênesis 6. Ele pertence
  aos manuscritos do Mar Morto, textos antigos achados em grutas junto
  ao Mar Morto. Entre esses manuscritos, é a cópia de Gênesis mais
  antiga conhecida até a publicação de Crawford (2012). Ser a mais
  antiga conhecida não faz dele a mais antiga que já existiu. O texto
  original de Gênesis é anterior a qualquer cópia que chegou até nós.
