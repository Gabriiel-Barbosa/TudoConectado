id: 6qpaleogen-confirma-genesis
tipo: confirma
entre:
  - registro: genesis
  - registro: manuscrito-6qpaleogen
evidencia:
  tipo_de_apoio: achado_arqueologico
  forca: bem_estabelecido
  quem_sustenta:
    - nome: "Sidnie White Crawford"
      ano: 2012
fontes:
  - nivel: 1
    descricao: "Dead Sea Scrolls Digital Library (Israel Antiquities Authority), manuscrito 6Q1 (6QpaleoGen)"
  - nivel: 2
    descricao: "Crawford, S. W. (2012), 'Genesis in the Dead Sea Scrolls', Brill"
o_que_derrubaria: >
  Nova análise paleográfica que revise a datação do fragmento para um
  período significativamente posterior, ou evidência de que o texto de
  6QpaleoGen diverge do texto de Gênesis 6 a ponto de não poder ser
  considerado o mesmo livro.
notas: >
  É a cópia mais antiga de Gênesis entre os manuscritos do Mar Morto
  conhecida até a publicação de Crawford (2012) — não necessariamente a
  mais antiga cópia já existente do texto (o original é anterior a
  qualquer cópia sobrevivente).
