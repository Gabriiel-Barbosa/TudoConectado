id: 6qpaleogen-confirma-genesis
tipo: confirma
entre:
  - registro: genesis
  - registro: manuscrito-6qpaleogen
evidencia:
  tipo_de_apoio: achado_arqueologico
  forca: bem_estabelecido
  quem_sustenta:
    - nome: "Sidnie White Crawford"
      ano: 2012
fontes:
  - nivel: 1
    descricao: "Dead Sea Scrolls Digital Library (Israel Antiquities Authority), manuscrito 6Q1 (6QpaleoGen)"
    url: "https://www.deadseascrolls.org.il/explore-the-archive/manuscript/6Q1-1"
  - nivel: 2
    descricao: "Crawford, Sidnie White (2012), 'Genesis in the Dead Sea Scrolls', em Craig A. Evans, Joel N. Lohr e David L. Petersen (orgs.), The Book of Genesis: Composition, Reception, and Interpretation (Supplements to Vetus Testamentum 152), Brill, pp. 353–373 (6QpaleoGen na p. 353), doi:10.1163/9789004226579_016"
    url: "https://doi.org/10.1163/9789004226579_016"
o_que_derrubaria: >
  Esta ligação cairia em dois casos. O primeiro seria uma nova análise
  paleográfica (a datação pelo estilo da letra) que empurrasse o
  fragmento para um período bem posterior. O segundo seria a evidência de
  que o texto de 6QpaleoGen se afasta tanto de Gênesis 6 que já não dá
  para tratá-lo como o mesmo livro.
notas: >
  Entre os manuscritos do Mar Morto (textos antigos achados em grutas
  junto ao Mar Morto), este fragmento é a cópia de Gênesis mais antiga
  conhecida até a publicação de Crawford (2012). Isso não faz dele a
  cópia mais antiga que já existiu. O texto original de Gênesis é
  anterior a qualquer cópia que chegou até nós.
