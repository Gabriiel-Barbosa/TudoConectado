o_que_derrubaria: >-
  O paralelo cairia se a leitura das tabuinhas mostrasse que Adapa não
  recebe proibição de comer sob pena de morte, ou que o alimento recusado
  não tem relação com a vida sem fim.
notas: >-
  O que as fontes afirmam é semelhança, não dependência. Skinner acha os
  traços comuns muito marcantes — sabedoria e imortalidade como aquilo que
  faria do homem um igual dos deuses, o homem obtendo a primeira e perdendo
  a segunda, e vozes sobrenaturais aconselhando em sentidos opostos — mas
  chama o conjunto de quase uma paródia de Gênesis 3, e trata a viagem do
  mito da Babilônia a Israel como conjetura plausível, não como fato.
  Speiser chama Adapa e Gilgamesh de análogos sugestivos e considera este
  terreno mais firme que o de outros motivos do capítulo — a ressalva dele
  de que a fonte específica e o caminho de transmissão permanecem incertos
  está no parágrafo anterior e é sobre outro motivo, não sobre Adapa.
  Buccellati propõe uma
  comparação e lista as semelhanças, apontando ele mesmo as diferenças na
  ordem dos acontecimentos e na natureza da desobediência. Nenhuma das três
  sustenta cópia, e por isso a ligação é de tipo paralelo.
