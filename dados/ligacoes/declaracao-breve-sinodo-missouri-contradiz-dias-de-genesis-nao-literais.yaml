id: declaracao-breve-sinodo-missouri-contradiz-dias-de-genesis-nao-literais
tipo: contradiz
entre:
  - registro: declaracao-breve-sinodo-missouri
  - afirmacao: dias-de-genesis-nao-literais
evidencia:
  tipo_de_apoio: texto
  forca: bem_estabelecido
  quem_sustenta: []
fontes:
  - nivel: 1
    descricao: >-
      Igreja Luterana–Sínodo de Missouri, Brief Statement of the Doctrinal
      Position of the Missouri Synod (1932), seção "Of Creation"
    url: >-
      https://www.lcms.org/about/beliefs/doctrine/brief-statement-of-lcms-doctrinal-position
o_que_derrubaria: >-
  A ideia de que o Sínodo de Missouri exige a leitura literal cairia se a
  seção sobre a criação não afirmasse os seis dias no tempo registrado em
  Gênesis, ou se o sínodo revogasse a declaração.
notas: >-
  A declaração ensina que Deus criou céus e terra do modo e no espaço de
  tempo registrados em Gênesis 1 e 2, em seis dias, e rejeita a ideia de que
  o mundo tenha se desenvolvido mais ou menos por conta própria, pela
  evolução, ao longo de imensos períodos de tempo. É um
  exemplo documentado da leitura literal dos dias.
