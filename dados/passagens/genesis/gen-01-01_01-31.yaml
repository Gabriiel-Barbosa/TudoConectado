id: gen-01-01_01-31
referencia: Gênesis 1:1–31
titulo: A criação do mundo em seis dias
texto: genesis-01
afirma:
  - >-
    No princípio, Deus cria os céus e a terra. A terra está sem forma e
    vazia, as trevas cobrem o abismo, e o Espírito de Deus se move sobre as
    águas.
  - >-
    Em seis dias, Deus cria pela palavra: a luz; a expansão que separa as
    águas de cima das de baixo; a terra seca e as plantas; o Sol, a Lua e as
    estrelas; os animais das águas e as aves; os animais da terra e, por
    fim, o ser humano.
  - >-
    Deus cria o ser humano, homem e mulher, à sua imagem, abençoa-o e lhe dá
    domínio sobre os animais. Cada dia termina com a frase “e foi a tarde e
    a manhã”, e Deus vê que o que fez é bom.
