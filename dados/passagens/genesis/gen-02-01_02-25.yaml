id: gen-02-01_02-25
referencia: Gênesis 2:1–25
titulo: O sétimo dia e o jardim do Éden
texto: genesis-02
afirma:
  - Deus termina a obra da criação, descansa no sétimo dia e o abençoa.
  - >-
    Começa então outro relato: o SENHOR Deus forma o homem do pó da terra,
    sopra nele o fôlego de vida e o põe num jardim no Éden, com a árvore da
    vida e a árvore do conhecimento do bem e do mal, da qual o proíbe de
    comer.
  - >-
    Do Éden sai um rio que se divide em quatro, entre eles o Tigre e o
    Eufrates. Deus forma os animais, que o homem nomeia, e, de uma costela
    do homem, a mulher.
