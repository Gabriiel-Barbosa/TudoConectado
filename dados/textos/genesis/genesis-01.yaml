versiculos:
  - 'n': 1
    texto: No princípio criou Deus os céus e a terra.
  - 'n': 2
    texto: E a terra estava desordenada e vazia, e as trevas estavam sobre a face do abismo, e o Espírito de Deus se movia sobre a face das águas.
  - 'n': 3
    texto: 'E disse Deus: Haja luz; e houve luz.'
  - 'n': 4
    texto: 'E viu Deus que a luz era boa: e separou Deus a luz das trevas.'
  - 'n': 5
    texto: 'E chamou Deus à luz Dia, e às trevas chamou Noite: e foi a tarde e a manhã o primeiro dia.'
  - 'n': 6
    texto: 'E disse Deus: Haja expansão em meio das águas, e separe as águas das águas.'
  - 'n': 7
    texto: 'E fez Deus a expansão, e separou as águas que estavam debaixo da expansão, das águas que estavam sobre a expansão: e foi assim.'
  - 'n': 8
    texto: 'E chamou Deus à expansão Céus: e foi a tarde e a manhã, o dia segundo.'
  - 'n': 9
    texto: 'E disse Deus: Juntem-se as águas que estão debaixo dos céus em um lugar, e descubra-se a porção seca; e foi assim.'
  - 'n': 10
    texto: E chamou Deus à porção seca Terra, e à reunião das águas chamou Mares; e viu Deus que era bom.
  - 'n': 11
    texto: 'E disse Deus: Produza a terra erva verde, erva que dê semente; árvore de fruto que dê fruto segundo a sua espécie, que sua semente esteja nela, sobre a terra: e foi assim.'
  - 'n': 12
    texto: E produziu a terra erva verde, erva que dá semente segundo sua natureza, e árvore que dá fruto, cuja semente está nele, segundo a sua espécie; e viu Deus que era bom.
  - 'n': 13
    texto: E foi a tarde e a manhã, o dia terceiro.
  - 'n': 14
    texto: 'E disse Deus: Haja luminares na expansão dos céus para separar o dia e a noite: e sejam por sinais, e para as estações, e para dias e anos;'
  - 'n': 15
    texto: 'E sejam por luminares na expansão dos céus para iluminar sobre a terra: e foi.'
  - 'n': 16
    texto: E fez Deus os dois grandes luminares; o luminar maior para que exerça domínio no dia, e o luminar menor para que exerça domínio na noite; fez também as estrelas.
  - 'n': 17
    texto: E as pôs Deus na expansão dos céus, para iluminar sobre a terra,
  - 'n': 18
    texto: 'E para exercer domínio no dia e na noite, e para separar a luz e as trevas: e viu Deus que era bom.'
  - 'n': 19
    texto: E foi a tarde e a manhã, o dia quarto.
  - 'n': 20
    texto: 'E disse Deus: Produzam as águas répteis de alma vivente, e aves que voem sobre a terra, na expansão aberta dos céus.'
  - 'n': 21
    texto: 'E criou Deus as grandes criaturas marinhas, e toda coisa viva que anda arrastando, que as águas produziram segundo a sua espécie, e toda ave de asas segundo sua espécie: e viu Deus que era bom.'
  - 'n': 22
    texto: 'E Deus os abençoou dizendo: Frutificai e multiplicai, e enchei as águas nos mares, e as aves se multipliquem na terra.'
  - 'n': 23
    texto: E foi a tarde e a manhã, o dia quinto.
  - 'n': 24
    texto: 'E disse Deus: Produza a terra seres viventes segundo a sua espécie, animais e serpentes e animais da terra segundo sua espécie: e foi assim.'
  - 'n': 25
    texto: 'E fez Deus animais da terra segundo a sua espécie, e gado segundo a sua espécie, e todo animal que anda arrastando sobre a terra segundo sua espécie: e viu Deus que era bom.'
  - 'n': 26
    texto: 'E disse Deus: Façamos ao ser humano à nossa imagem, conforme nossa semelhança; e domine os peixes do mar, e as aves dos céus, e os animais, e toda a terra, e todo animal que anda arrastando sobre a terra.'
  - 'n': 27
    texto: E criou Deus o ser humano à sua imagem, à imagem de Deus o criou; macho e fêmea os criou.
  - 'n': 28
    texto: 'E Deus os abençoou; e disse-lhes Deus: Frutificai e multiplicai, e enchei a terra, e subjugai-a, e dominai os peixes do mar, as aves dos céus, e todos os animais que se movem sobre a terra.'
  - 'n': 29
    texto: 'E disse Deus: Eis que vos dei toda erva que dá semente, que está sobre a face de toda a terra; e toda árvore em que há fruto de árvore que dá semente, vos será para comer.'
  - 'n': 30
    texto: 'E a todo animal da terra, e a todas as aves dos céus, e a tudo o que se move sobre a terra, em que há vida, toda erva verde lhes será para comer: e foi assim.'
  - 'n': 31
    texto: E viu Deus tudo o que havia feito, e eis que era bom em grande maneira. E foi a tarde e a manhã, o dia sexto.
