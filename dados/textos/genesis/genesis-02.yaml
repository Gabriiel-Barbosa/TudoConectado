versiculos:
  - 'n': 1
    texto: E foram concluídos os céus e a terra, e tudo o que neles há.
  - 'n': 2
    texto: E acabou Deus no dia sétimo sua obra que fez, e repousou o dia sétimo de toda sua obra que havia feito.
  - 'n': 3
    texto: E abençoou Deus ao dia sétimo, e o santificou, porque nele repousou de toda sua obra que havia Deus criado e feito.
  - 'n': 4
    texto: Estas são as origens dos céus e da terra quando foram criados, no dia que o SENHOR Deus fez a terra e os céus,
  - 'n': 5
    texto: E antes que toda planta do campo existisse na terra, e antes que toda erva do campo nascesse; porque ainda não havia o SENHOR Deus feito chover sobre a terra, nem havia homem para que lavrasse a terra;
  - 'n': 6
    texto: Mas subia da terra um vapor, que regava toda a face da terra.
  - 'n': 7
    texto: Formou, pois, o SENHOR Deus ao homem do pó da terra, e assoprou em seu nariz sopro de vida; e foi o homem em alma vivente.
  - 'n': 8
    texto: E havia o SENHOR Deus plantado um jardim em Éden ao oriente, e pôs ali ao homem que havia formado.
  - 'n': 9
    texto: 'E havia o SENHOR Deus feito nascer da terra toda árvore agradável à vista, e boa para comer: também a árvore da vida em meio do jardim, e a árvore do conhecimento do bem e do mal.'
  - 'n': 10
    texto: E saía de Éden um rio para regar o jardim, e dali se repartia em quatro ramificações.
  - 'n': 11
    texto: 'O nome de um era Pisom: este é o que cerca toda a terra de Havilá, onde há ouro:'
  - 'n': 12
    texto: E o ouro daquela terra é bom; há ali também bdélio e pedra ônix.
  - 'n': 13
    texto: O nome do segundo rio é Giom; este é o que rodeia toda a terra de Cuxe.
  - 'n': 14
    texto: E o nome do terceiro rio é Tigre; este é o que vai diante da Assíria. E o quarto rio é o Eufrates.
  - 'n': 15
    texto: Então o SENHOR Deus tomou o homem, e o pôs no jardim de Éden, para que o lavrasse e o guardasse.
  - 'n': 16
    texto: 'E mandou o SENHOR Deus ao homem, dizendo: De toda árvore do jardim comerás;'
  - 'n': 17
    texto: Mas da árvore do conhecimento do bem e do mal não comerás dela; porque no dia que dela comeres, morrerás.
  - 'n': 18
    texto: 'E disse o SENHOR Deus: Não é bom que o homem esteja só; farei para ele ajuda idônea para ele.'
  - 'n': 19
    texto: Formou, pois, o SENHOR Deus da terra todo animal do campo, e toda ave dos céus, e trouxe-os a Adão, para que visse como lhes havia de chamar; e tudo o que Adão chamou aos animais viventes, esse é seu nome.
  - 'n': 20
    texto: 'E pôs Adão nomes a todo animal e ave dos céus e a todo animal do campo: mas para Adão não achou ajuda que estivesse idônea para ele.'
  - 'n': 21
    texto: 'E o SENHOR Deus fez cair sonho sobre Adão, e ele adormeceu: então tomou uma de suas costelas, e fechou a carne em seu lugar;'
  - 'n': 22
    texto: E da costela que o SENHOR Deus tomou do homem, fez uma mulher, e trouxe-a ao homem.
  - 'n': 23
    texto: 'E disse Adão: Esta é agora osso de meus ossos, e carne de minha carne: esta será chamada Mulher, porque do homem foi tomada.'
  - 'n': 24
    texto: Portanto, deixará o homem a seu pai e a sua mãe, e se achegará à sua mulher, e serão uma só carne.
  - 'n': 25
    texto: E estavam ambos nus, Adão e sua mulher, e não se envergonhavam.
