versiculos:
  - 'n': 1
    texto: 'E Adão conheceu a sua mulher Eva, a qual concebeu e deu à luz a Caim, e disse: Obtive um homem pelo SENHOR.'
  - 'n': 2
    texto: E depois deu à luz a seu irmão Abel. E foi Abel pastor de ovelhas, e Caim foi lavrador da terra.
  - 'n': 3
    texto: E aconteceu, decorrendo o tempo, que Caim trouxe do fruto da terra uma oferta ao SENHOR.
  - 'n': 4
    texto: E Abel trouxe também dos primogênitos de suas ovelhas, e de sua gordura. E olhou o SENHOR com agrado a Abel e à sua oferta;
  - 'n': 5
    texto: mas não olhou com bons olhos a Caim e à sua oferta. Caim irritou-se muito, e descaiu-lhe o semblante.
  - 'n': 6
    texto: 'Então o SENHOR disse a Caim: Por que te irritaste, e por que o teu semblante descaiu?'
  - 'n': 7
    texto: Se bem fizeres, não serás aceito? E se não fizeres bem, o pecado está à porta; contra ti será o seu desejo, porém tu deves dominá-lo.
  - 'n': 8
    texto: Depois Caim falou a seu irmão Abel; e aconteceu que, estando eles no campo, Caim se levantou contra seu irmão Abel, e o matou.
  - 'n': 9
    texto: 'E o SENHOR disse a Caim: Onde está teu irmão Abel? E ele respondeu: Não sei; sou eu guarda do meu irmão?'
  - 'n': 10
    texto: 'E ele lhe disse: Que fizeste? A voz do sangue do teu irmão clama a mim desde a terra.'
  - 'n': 11
    texto: 'Agora, pois, maldito sejas tu da terra que abriu sua boca para receber o sangue de teu irmão de tua mão:'
  - 'n': 12
    texto: 'Quando lavrares a terra, não te voltará a dar sua força: errante e fugitivo serás na terra.'
  - 'n': 13
    texto: 'E disse Caim ao SENHOR: Grande é minha iniquidade para ser perdoada.'
  - 'n': 14
    texto: Eis que me expulsas hoje da face da terra, e de tua presença me esconderei; e serei errante e fugitivo na terra; e sucederá que qualquer um que me achar, me matará.
  - 'n': 15
    texto: 'E respondeu-lhe o SENHOR: Certo que qualquer um que matar a Caim, sete vezes será castigado. Então o SENHOR pôs sinal em Caim, para que não o ferisse qualquer um que o achasse.'
  - 'n': 16
    texto: E saiu Caim de diante do SENHOR, e habitou na terra de Node, ao oriente de Éden.
  - 'n': 17
    texto: 'E conheceu Caim a sua mulher, a qual concebeu e deu à luz a Enoque: e edificou uma cidade, e chamou o nome da cidade do nome de seu filho, Enoque.'
  - 'n': 18
    texto: E a Enoque nasceu Irade, e Irade gerou a Meujael, e Meujael gerou a Metusael, e Metusael gerou a Lameque.
  - 'n': 19
    texto: E tomou para si Lameque duas mulheres; o nome de uma foi Ada, e o nome da outra Zilá.
  - 'n': 20
    texto: E Ada deu à luz a Jabal, o qual foi pai dos que habitam em tendas, e criam gados.
  - 'n': 21
    texto: E o nome de seu irmão foi Jubal, o qual foi pai de todos os que manejam harpa e flauta.
  - 'n': 22
    texto: 'E Zilá também deu à luz a Tubalcaim, feitor de toda obra de bronze e de ferro: e a irmã de Tubalcaim foi Naamá.'
  - 'n': 23
    texto: 'E disse Lameque a suas mulheres: Ada e Zilá, ouvi minha voz; Mulheres de Lameque, escutai meu dito: Que matei um homem por ter me ferido, E um rapaz por ter me golpeado:'
  - 'n': 24
    texto: Se sete vezes será vingado Caim, Lameque em verdade setenta vezes sete o será.
  - 'n': 25
    texto: 'E conheceu de novo Adão à sua mulher, a qual deu à luz um filho, e chamou seu nome Sete: Porque Deus (disse ela) me substituiu outra descendência em lugar de Abel, a quem matou Caim.'
  - 'n': 26
    texto: E a Sete também lhe nasceu um filho, e chamou seu nome Enos. Então os homens começaram a invocar o nome do SENHOR.
