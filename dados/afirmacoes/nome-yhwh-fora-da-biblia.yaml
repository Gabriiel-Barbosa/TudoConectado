id: nome-yhwh-fora-da-biblia
texto: "O deus de Israel já era chamado pelo nome YHWH na Antiguidade, em textos de fora da Bíblia."
registros_envolvidos: [deus]
datacao:
  - periodo: [-842, -805]
    segundo_quem: >
      Segundo o catálogo do Museu do Louvre, a Estela de Mesa foi gravada
      pouco depois de 842 a.C., no reinado de Mesa, rei de Moabe (c. 830–805
      a.C.). Nas linhas 17 e 18, o rei conta que tomou os vasos de YHWH e os
      levou diante de Camós, o deus de Moabe.
  - periodo: [-725, -650]
    segundo_quem: >
      Segundo Erik Waaler (2002), os amuletos de prata de Ketef Hinnom, que
      trazem o nome YHWH, são de entre 725 e 650 a.C. A datação é discutida:
      outros estudiosos situam os amuletos mais tarde, no fim do século VII
      ou no começo do século VI a.C.
