id: autoria-mosaica-genesis
texto: "Gênesis foi escrito por Moisés."
registros_envolvidos: [moises, genesis]
datacao:
  - periodo: [-1446, -1200]
    segundo_quem: >
      Cronologia tradicional — faixa ampla porque a própria tradição diverge
      internamente entre uma datação "alta" (~séc. XV a.C., leitura literal
      de 1 Reis 6:1) e uma "baixa" (~séc. XIII a.C., associada ao Êxodo sob
      Ramessés II).
