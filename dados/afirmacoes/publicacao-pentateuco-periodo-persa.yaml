id: publicacao-pentateuco-periodo-persa
texto: "O Pentateuco, do qual Gênesis faz parte, foi publicado pela primeira vez depois do exílio na Babilônia, no período persa."
registros_envolvidos: [genesis, hipotese-documentaria]
datacao:
  - periodo: [-539, -332]
    segundo_quem: >
      Segundo Thomas Römer (2008), há amplo acordo entre os estudiosos de
      que o Pentateuco, ou uma primeira versão dele, foi publicado pela
      primeira vez em meados do período persa. Gênesis, o primeiro dos
      cinco livros, entra nessa datação por fazer parte do conjunto. O
      intervalo registrado aqui é o do período persa inteiro, de 539 a 332
      a.C., porque o autor não dá anos.
  - periodo: [-458, -444]
    segundo_quem: >
      Segundo Julius Wellhausen (1885), o Pentateuco só se tornou
      conhecido como lei de Moisés em 444 a.C., quando Esdras o publicou em
      Jerusalém, cerca de um século depois do exílio na Babilônia. Esdras
      havia chegado à cidade em 458 a.C. Gênesis, o primeiro dos cinco
      livros, entra nessa datação por fazer parte do conjunto.
