id: idade-do-universo
texto: O universo começou há cerca de 13,8 bilhões de anos.
registros_envolvidos:
  - missao-planck
datacao:
  - periodo:
      - -13820000000
      - -13774000000
    segundo_quem: >-
      Segundo a colaboração Planck (2020), na análise padrão e dentro do
      modelo cosmológico padrão, o universo tem 13,797 bilhões de anos, com margem de 23
      milhões de anos para mais ou para menos. O intervalo registrado aqui é
      essa margem.
