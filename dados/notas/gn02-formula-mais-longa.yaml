  - 4
titulo: A Septuaginta alonga a fórmula
descricao: >-
  Na Septuaginta, a fórmula do versículo 4 fica mais longa, igual à que abre
  Gênesis 5 (“Este é o livro da origem…”). Para Hendel (1998), foi um
  copista da tradição grega que igualou as duas; o hebraico padrão guarda a
  forma curta, que é a original.
fontes:
  - nivel: 2
    descricao: >-
      Hendel, R. S. (1998), The Text of Genesis 1–11: Textual Studies and
      Critical Edition, Nova York/Oxford: Oxford University Press, p. 34
notas: null
trecho: dos céus e da terra quando foram criados
