id: gn01-aguas-frase-a-mais
tipo: variante
versiculos:
  - 9
  - 9
titulo: Uma frase a mais sobre as águas
descricao: >-
  A Septuaginta acrescenta ao versículo 9 uma frase que não está no hebraico
  padrão: a água que estava debaixo do céu se juntou nos seus ajuntamentos,
  e a terra seca apareceu. As duas últimas palavras dessa frase aparecem em
  hebraico num manuscrito de Qumran, 4QGen-k. Hendel (1998) considera essa a
  leitura original, que o texto hebraico padrão teria perdido.
fontes:
