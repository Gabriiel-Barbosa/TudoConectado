id: gn02-mulher-e-homem
tipo: traducao
passagem: gen-02-01_02-25
versiculos:
  - 23
  - 23
titulo: 'Mulher e homem: um jogo de palavras'
descricao: >-
  Em hebraico, “mulher” (‘ishshah) e “homem” (‘ish) soam como se uma palavra
  viesse da outra, e o versículo se apoia nisso. Mas, segundo Skinner
  (1910), a comparação com outras línguas semíticas mostra que as duas
  palavras têm raízes diferentes: resta só uma assonância muito forte.
fontes:
  - nivel: 2
    descricao: >-
      Skinner, J. (1910), A Critical and Exegetical Commentary on Genesis
      (International Critical Commentary), Nova York: Charles Scribner's
      Sons, p. 69
    url: https://archive.org/details/criticalexegetic00skinuoft
notas: null
trecho: esta será chamada Mulher, porque do homem foi tomada
