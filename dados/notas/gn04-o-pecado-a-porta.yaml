id: gn04-o-pecado-a-porta
tipo: traducao
passagem: gen-04-01_04-26
versiculos:
  - 7
  - 7
titulo: O versículo mais obscuro do capítulo
descricao: >-
  O aviso que Deus dá a Caim antes do crime é, no hebraico, quase
  intraduzível. Skinner (1910) reúne três problemas. A primeira expressão do
  versículo é curta e ambígua. A palavra "pecado" (chattat) é feminina, mas o
  que vem depois dela está no masculino, uma discordância de gênero que o
  hebraico não costuma admitir. E a segunda metade do versículo repete, quase
  palavra por palavra, a sentença dada à mulher em 3:16. A conclusão de
  Skinner é dura: toda tentativa de extrair um sentido do versículo é mais ou
  menos um tour de force, e é quase certo que a obscuridade venha de uma
  corrupção profunda do texto. Ou seja, a dificuldade não estaria em entender
  o que o autor quis dizer, e sim no fato de o texto ter chegado danificado.
leituras:
  - leitura: >-
      O texto chegou corrompido, e o sentido original não é recuperável
    quem: Skinner (1910, pp. 106-107), para quem qualquer sentido extraído do versículo é um tour de force
  - leitura: >-
      "Robets" é o particípio de um verbo, e a imagem é a do pecado como fera
      acocorada à porta
    quem: Leitura que Skinner (1910, p. 107) descreve como corrente, mas considera uma metáfora forçada, sem dizer à porta de quê
  - leitura: '"Robets" é um substantivo: "o pecado está à porta, um espreitador"'
    quem: Leitura de Ewald e outros, que Skinner (1910, p. 107) registra como tentativa de resolver a discordância de gênero, mas não aceita
fontes:
  - nivel: 2
    descricao: >-
      Skinner, J. (1910), A Critical and Exegetical Commentary on Genesis
      (International Critical Commentary), Nova York: Charles Scribner's
      Sons, pp. 106-107, citando Olshausen (1870)
    url: https://archive.org/details/criticalexegetic00skinuoft
  - nivel: 2
    descricao: >-
      Barré, M. L. (1999), "Rabisu", em K. van der Toorn, B. Becking e P. W.
      van der Horst (orgs.), Dictionary of Deities and Demons in the Bible,
      2ª ed. revista, Leiden/Boston: Brill; Grand Rapids: Eerdmans, p. 681
notas: >-
  Dois cuidados. Primeiro: é comum ouvir que "robets" seria um empréstimo do
  acádio "rabisu", o demônio que espreita, e que o versículo mostraria o
  pecado como um demônio à espera de Caim. Barré (1999) confirma que essa é
  de fato uma posição comum entre comentaristas, mas a qualifica — a
  passagem é problemática demais para uma solução satisfatória, e o rabisu
  das fontes acádias é um ser que ataca a vítima, não um que a tenta a
  pecar. Skinner não menciona o rabisu em nenhum ponto. Segundo: a repetição
  de 3:16 aqui é tentadora de ler como eco literário deliberado, o desejo e o
  domínio voltando num novo contexto. Skinner sustenta o contrário, e com
  todas as letras: acha a semelhança verbal suspeita, diz que uma paródia da
  linguagem de um predecessor não se atribui a um autor antigo, e propõe que
  o olho de um copista tenha vagado para 3:16 na coluna ao lado, com as
  palavras erradas ajustadas depois ao contexto atual. Ele observa ainda que
  no Pentateuco Samaritano os sufixos aparecem invertidos. A nota registra a
  posição dele, não a leitura literária.
trecho: o pecado está à porta
