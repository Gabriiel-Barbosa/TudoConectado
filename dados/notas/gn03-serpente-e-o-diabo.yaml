id: gn03-serpente-e-o-diabo
tipo: traducao
passagem: gen-03-01_03-24
versiculos:
  - 1
  - 1
titulo: A serpente do jardim não é o diabo
descricao: >-
  O capítulo apresenta a serpente como um animal entre os outros: astuta,
  mas criatura, feita como as demais. Em nenhum momento ela é chamada de
  Satanás, nem tratada como um ser sobrenatural. Skinner (1910) é direto
  ao dizer que identificar as duas figuras é estranho ao pensamento de quem
  escreveu Gênesis 3, e mostra que essa leitura nasce bem depois, no
  judaísmo de Alexandria, na Sabedoria de Salomão, que fala da morte tendo
  entrado no mundo pela inveja do diabo. Ele aponta ainda uma possível
  alusão anterior em 1 Enoque, onde quem seduz Eva é um Satã de nome
  Gadreel. O próprio Satanás como personagem, observa Skinner, só aparece
  no Antigo Testamento depois do exílio. Lagunov (2019), que estudou a
  história da leitura desses versículos, traça o mesmo caminho com mais
  detalhe: a identificação assoma em escrita judaica do século II a.C., de
  forma alusiva; fica explícita em textos do fim do século I d.C. em
  diante, como o Apocalipse, que chama a antiga serpente de Diabo e
  Satanás; e só vira leitura padrão com os Padres da Igreja, que passam a
  ler um texto à luz do outro.
leituras:
  - leitura: A serpente é um animal, e nada além disso, no texto de Gênesis 3
    quem: Skinner (1910, p. 73), para quem a identificação com o diabo é estranha ao autor
  - leitura: A serpente é o diabo
    quem: Leitura que Skinner (1910, p. 73) situa no judaísmo alexandrino, a partir da Sabedoria de Salomão 2:24, e que Lagunov (2019, pp. 211–212) vê nascer no século II a.C. e se firmar com os Padres da Igreja
fontes:
  - nivel: 2
    descricao: >-
      Skinner, J. (1910), A Critical and Exegetical Commentary on Genesis
      (International Critical Commentary), Nova York: Charles Scribner's
      Sons, p. 73
    url: https://archive.org/details/criticalexegetic00skinuoft
  - nivel: 2
    descricao: >-
      Lagunov, S. V. (2019), Following the Traces of the Serpent in the Old
      and New Testaments and the Early Jewish Interpretation: Genesis
      3:1–15 in Light of Its Reception History, tese de doutorado,
      Protestantse Theologische Universiteit, Amsterdã/Groningen, pp. 94 e
      211–212
    url: https://theoluniv.ub.rug.nl/146/1/Lagunov_S_Following%20the%20traces%20of%20the%20serpent_14febr2019.pdf
notas: >-
  A nota diz quando a identificação aparece, não que ela seja ilegítima
  como leitura teológica. O próprio Skinner a chama de extensão natural do
  que Gênesis 3 ensina — o ponto é que ela não está no capítulo.
trecho: a serpente era astuta
