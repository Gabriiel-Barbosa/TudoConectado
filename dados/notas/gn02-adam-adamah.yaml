id: gn02-adam-adamah
tipo: traducao
passagem: gen-02-01_02-25
versiculos:
  - 7
  - 7
titulo: Adam, feito da adamah
descricao: >-
  Em hebraico, “homem” (adam) e “terra” (adamah) soam quase iguais, e o
  texto tira proveito disso: o homem é feito do solo, vive de cultivá-lo e
  volta a ele na morte, como resume Skinner (1910). A origem das duas
  palavras é incerta; a velha explicação por uma raiz que significa “ser
  vermelho” foi abandonada, mas nada melhor a substituiu.
fontes:
  - nivel: 2
    descricao: >-
      Skinner, J. (1910), A Critical and Exegetical Commentary on Genesis
      (International Critical Commentary), Nova York: Charles Scribner's
      Sons, p. 56
    url: https://archive.org/details/criticalexegetic00skinuoft
notas: null
trecho: do pó da terra
