id: gn02-senhor-deus
tipo: traducao
passagem: gen-02-01_02-25
versiculos:
  - 4
  - 4
titulo: Por que agora “o SENHOR Deus”?
descricao: >-
  Em Gênesis 1, o texto hebraico chama Deus só de Elohim, mais de 35 vezes.
  A partir daqui passa a usar o par YHWH Elohim, que as traduções vertem por
  “o SENHOR Deus”, e o usa 30 vezes até o fim do capítulo 3. Hendel (1998)
  chama a mudança de surpreendente para qualquer leitor. Para os estudiosos
  da crítica das fontes, ela é uma das marcas de que começa outro relato, e
  Skinner (1910) atribui o nome duplo, quase exclusivo de Gênesis 2 e 3, ao
  trabalho de quem juntou os textos. Os rabinos clássicos, segundo Hendel,
  liam os dois nomes como dois atributos de Deus.
fontes:
