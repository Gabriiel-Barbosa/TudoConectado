id: gn02-estas-sao-as-origens
tipo: traducao
passagem: gen-02-01_02-25
versiculos:
  - 4
  - 4
titulo: '“Estas são as origens”: fim de um relato ou começo de outro?'
descricao: >-
  A fórmula hebraica toledot, traduzida por “origens” ou “gerações”, costuma
  abrir uma nova seção de Gênesis. Aqui ela fica entre os dois relatos da
  criação, e não se encaixa bem em nenhum dos dois. Skinner (1910) acha a
  meia frase “desconcertante no último grau” e a considera, com toda a
  probabilidade, uma inserção de quem editou o livro.
fontes:
  - nivel: 2
    descricao: >-
      Skinner, J. (1910), A Critical and Exegetical Commentary on Genesis
      (International Critical Commentary), Nova York: Charles Scribner's
      Sons, pp. 39–40
    url: https://archive.org/details/criticalexegetic00skinuoft
notas: null
trecho: Estas são as origens
