id: gn03-conhecimento-do-bem-e-do-mal
tipo: traducao
passagem: gen-03-01_03-24
versiculos:
  - 5
  - 5
titulo: Que conhecimento é “o bem e o mal”?
descricao: >-
  A expressão parece clara em português, mas os estudiosos não concordam
  sobre o que ela significa no hebraico. Skinner (1910) reúne quatro
  propostas: conhecimento mágico, que ele descarta; discernimento moral,
  saber distinguir o certo do errado, defendida por Budde; domínio prático
  sobre a natureza, no sentido do saber que funda a civilização, defendida
  por Wellhausen; e amadurecimento, o juízo que vem com a idade adulta,
  defendida por Gunkel, que inclui o discernimento moral sem se reduzir a
  ele. Skinner pondera que as duas últimas têm mais apoio no texto que a
  leitura puramente moral. Pesa a favor delas o uso da expressão no resto
  da Bíblia, onde saber o bem e o mal marca a diferença entre a criança e
  o adulto, e também o discernimento de quem julga.
leituras:
  - leitura: Discernimento moral, entre o certo e o errado
    quem: Budde, conforme Skinner (1910, p. 96)
  - leitura: Domínio prático sobre a natureza, o saber que funda a civilização
    quem: Wellhausen, conforme Skinner (1910, p. 96)
  - leitura: Amadurecimento, o juízo próprio da idade adulta
    quem: Gunkel, conforme Skinner (1910, p. 96)
  - leitura: Conhecimento mágico
    quem: Proposta que Skinner (1910, p. 96) registra e descarta
fontes:
  - nivel: 2
    descricao: >-
      Skinner, J. (1910), A Critical and Exegetical Commentary on Genesis
      (International Critical Commentary), Nova York: Charles Scribner's
      Sons, pp. 94–97 (as quatro leituras na p. 96; o uso da expressão no
      Antigo Testamento em nota de rodapé na p. 95)
