id: gn04-invocar-o-nome
tipo: traducao
passagem: gen-04-01_04-26
versiculos:
  - 26
  - 26
titulo: O nome de Deus já é invocado aqui, e Êxodo diz o contrário
descricao: >-
  A última frase do capítulo registra que, no tempo de Enos, os homens
  começaram a invocar o nome do SENHOR — isto é, o nome YHWH já estaria em
  uso no começo da humanidade. Êxodo 6:3 afirma o oposto: que Deus apareceu a
  Abraão, Isaque e Jacó como Deus Todo-Poderoso, mas por seu nome YHWH não se
  deu a conhecer a eles. As duas frases não podem valer ao mesmo tempo. É um
  dos pontos de partida clássicos da Hipótese Documentária, que explica a
  contradição atribuindo as passagens a fontes diferentes: para a fonte J, a
  de Gênesis 4:26, o nome é conhecido desde o princípio; para E, em Êxodo
  3:13-15, e para P, em Êxodo 6:3, o nome depende de uma revelação expressa,
  ligada à fundação do povo hebreu. Skinner (1910) registra a diferença assim
  mesmo e chama a concepção de J de mais ingênua que a de E e P.
leituras:
  - leitura: >-
      As passagens vêm de fontes diferentes: J põe o nome no princípio, E e P
      o reservam para a revelação a Moisés
    quem: Skinner (1910, pp. 126-127); explicação que Glisson (1985/86, p. 137) resume como a leitura documentária corrente
  - leitura: >-
      Êxodo 3 pressupõe que os israelitas já conheciam o nome, e não é uma
      primeira revelação
    quem: Mowinckel (1937, p. 55), como Glisson (1985/86, p. 139) o cita
  - leitura: >-
      "Eu sou YHWH" é fórmula de autoapresentação, não revelação de um nome
      inédito, e Êxodo 6:3 não contradiz Gênesis 4:26
    quem: Cassuto (1967, pp. 76-77), como Glisson (1985/86, pp. 139-140) o resume
fontes:
  - nivel: 2
    descricao: >-
      Skinner, J. (1910), A Critical and Exegetical Commentary on Genesis
      (International Critical Commentary), Nova York: Charles Scribner's
      Sons, pp. 126-127
    url: https://archive.org/details/criticalexegetic00skinuoft
  - nivel: 2
    descricao: >-
      Glisson, S. D. (1985/86), "Exodus 6:3 in Pentateuchal Criticism",
      Restoration Quarterly 28.3, pp. 137 e 139-140
    url: https://biblicalelearning.org/wp-content/uploads/2022/01/Glisson-Ex6_3-ResQ.pdf
notas: >-
  As posições de Mowinckel e de Cassuto entram como Glisson as cita e resume,
  na página indicada; os originais dos dois não foram lidos diretamente, e
  ficam pendentes de conferência nas edições próprias. Vale distinguir as
  duas: Mowinckel discute dentro da crítica das fontes e contesta apenas que
  Êxodo 3 seja a primeira revelação do nome; Cassuto rejeita a divisão
  documentária como um todo.
trecho: começaram a invocar o nome do SENHOR
