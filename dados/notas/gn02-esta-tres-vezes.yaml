id: gn02-esta-tres-vezes
tipo: variante
passagem: gen-02-01_02-25
versiculos:
  - 23
  - 23
titulo: Um “esta” a mais
descricao: >-
  Na fala do homem sobre a mulher, o pronome “esta” aparece três vezes no
  hebraico padrão e só duas na Septuaginta e na Peshitta. Hendel (1998) vê o
  terceiro como um acréscimo de copista, feito para deixar claro quem é o
  sujeito de “foi tomada”.
fontes:
  - nivel: 2
    descricao: >-
      Hendel, R. S. (1998), The Text of Genesis 1–11: Textual Studies and
      Critical Edition, Nova York/Oxford: Oxford University Press, p. 44
notas: null
trecho: Esta é agora osso de meus ossos
