id: gn02-ajuda-idonea
tipo: traducao
passagem: gen-02-01_02-25
versiculos:
  - 18
  - 18
titulo: '“Ajuda idônea”: auxiliar ou contraparte?'
descricao: >-
  A expressão hebraica ‘ezer kenegdo diz, ao pé da letra, “uma ajuda como
  diante dele”, isto é, que lhe corresponda. Skinner (1910) observa que a
  palavra “ajuda” é usada no resto do Antigo Testamento sobretudo para o
  próprio Deus, como socorro de Israel. O termo, portanto, não traz em si a
  ideia de inferioridade.
fontes:
  - nivel: 2
    descricao: >-
      Skinner, J. (1910), A Critical and Exegetical Commentary on Genesis
      (International Critical Commentary), Nova York: Charles Scribner's
      Sons, p. 67
