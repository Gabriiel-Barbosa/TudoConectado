id: gn01-quem-separou
tipo: variante
versiculos:
  - 7
  - 7
titulo: Quem separou as águas?
descricao: >-
  No hebraico padrão do versículo 7, o sujeito de “separou” pode ser Deus ou
  a própria expansão. A Septuaginta desfaz a dúvida e escreve “Deus
  separou”. Hendel (1998) vê nisso um acréscimo feito para explicar o texto,
  e não uma palavra que o hebraico tenha perdido.
