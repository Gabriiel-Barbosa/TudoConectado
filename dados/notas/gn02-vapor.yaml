titulo: Vapor, névoa ou cheia?
descricao: >-
  A palavra hebraica traduzida por “vapor” só aparece mais uma vez em toda a
  Bíblia hebraica, e o sentido é incerto. A Vulgata entende “fonte” e o
  Targum, “nuvem”; muitos preferem “névoa”, um palpite natural, segundo
  Skinner (1910). Outra
  leitura, apoiada numa palavra assíria usada para a cheia anual de um rio,
  entende que a terra era regada por uma enchente, como nos campos irrigados
  da Mesopotâmia.
