id: gn01-tanninim
tipo: traducao
versiculos:
  - 21
  - 21
titulo: Grandes animais marinhos ou monstros do mar?
descricao: >-
  O versículo 21 fala dos tanninim, que a Bíblia Livre traduz por “grandes
  criaturas marinhas” e a Septuaginta, por “grandes monstros marinhos”. Aqui
  a palavra designa animais reais, mas Skinner (1910) observa que este é
  quase o único trecho em que ela tem certamente esse sentido. Em outros
  livros da Bíblia hebraica, ela carrega traços de mitologia e pode ter
  sido, na origem, o nome de monstros lendários como Tiamat.
