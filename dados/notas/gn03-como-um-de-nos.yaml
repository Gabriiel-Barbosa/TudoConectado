id: gn03-como-um-de-nos
tipo: traducao
passagem: gen-03-01_03-24
versiculos:
  - 22
  - 22
titulo: "“Como um de nós”: quem é “nós”?"
descricao: >-
  No versículo 22 Deus fala de si no plural, como já acontecera em “façamos
  o homem” no capítulo 1. Aqui não está em jogo a palavra elohim, e sim a
  forma plural da expressão: o ser humano ficou “como um de nós”. Skinner
  (1910) lê a frase como reconhecimento sério, e não como ironia — o ser
  humano tomou para si algo divino que não lhe era destinado. Ainda assim,
  não alcançou igualdade com Deus: a semelhança vale só quanto a conhecer
  o bem e o mal. Skinner nota também que a mesma ideia sai da boca da
  serpente no versículo 5, ali com a acusação de que Deus age por inveja.
leituras:
  - leitura: Admissão séria de que o ser humano tomou uma prerrogativa divina
    quem: Skinner (1910, pp. 87–88)
  - leitura: Ironia, uma repreensão em tom de escárnio
    quem: Leitura atribuída por Skinner (1910, pp. 87–88) a Calvino e outros, que ele recusa
fontes:
  - nivel: 2
    descricao: >-
      Skinner, J. (1910), A Critical and Exegetical Commentary on Genesis
      (International Critical Commentary), Nova York: Charles Scribner's
      Sons, pp. 87–88
    url: https://archive.org/details/criticalexegetic00skinuoft
notas: >-
  O plural aqui é o da expressão “um de nós”, não a palavra elohim do
  versículo 5. São dois fenômenos gramaticais diferentes, e a nota os
  mantém separados de propósito.
trecho: como um de Nos
