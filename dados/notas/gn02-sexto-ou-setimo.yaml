  - nivel: 2
    descricao: >-
      Hiebert, R. J. V. (trad.) (2007), "Genesis", em A. Pietersma e B. G.
      Wright (orgs.), A New English Translation of the Septuagint, Oxford:
      Oxford University Press, p. 7
    url: https://ccat.sas.upenn.edu/nets/edition/01-gen-nets.pdf
notas: null
trecho: E acabou Deus no dia sétimo
