id: gn01-e-assim-foi
tipo: variante
versiculos:
  - 6
  - 7
titulo: Onde fica o “e assim foi”?
descricao: >-
  No hebraico padrão, a frase “e assim foi” aparece seis vezes no capítulo,
  e no segundo dia vem no versículo 7. Na Septuaginta aparece sete vezes: já
  no fim do versículo 6 e também no versículo 20. Para Hendel (1998), essas
  diferenças vêm de ajustes feitos pelos copistas do texto hebraico que os
  tradutores gregos usaram, para deixar os dias mais parecidos entre si, e
  não de liberdade do tradutor.
