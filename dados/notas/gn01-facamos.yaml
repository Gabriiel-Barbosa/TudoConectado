id: gn01-facamos
tipo: traducao
versiculos:
  - 26
  - 26
titulo: '“Façamos”: com quem Deus fala?'
descricao: >-
  No versículo 26, Deus fala no plural: “Façamos ao ser humano à nossa
  imagem”. A quem esse plural se refere é uma pergunta que, nas palavras de
  Skinner (1910), sempre incomodou os leitores. Ele rejeita a leitura cristã
  que vê ali a Trindade, uma doutrina que diz ser desconhecida no Antigo
  Testamento, e considera mais natural e mais aceita a explicação de que
  Deus delibera com outros seres divinos, os anjos ou o exército celeste.
fontes:
  - nivel: 2
    descricao: >-
      Skinner, J. (1910), A Critical and Exegetical Commentary on Genesis
      (International Critical Commentary), Nova York: Charles Scribner's
      Sons, pp. 30–31
    url: https://archive.org/details/criticalexegetic00skinuoft
passagem: gen-01-01_01-31
notas: null
trecho: "Façamos ao ser humano"
