titulo: '“Alma vivente”: uma alma à parte?'
descricao: >-
  A expressão hebraica nefesh hayyah, traduzida por “alma vivente”, não fala
  de uma alma separada do corpo. Para Skinner (1910), a palavra designa o
  homem inteiro, dotado de vida: a vitalidade vem de Deus, pelo sopro, mas o
  texto não divide o ser humano em corpo, alma e espírito, como fizeram
  leituras posteriores.
fontes:
