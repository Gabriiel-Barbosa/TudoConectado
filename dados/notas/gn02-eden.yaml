titulo: O que quer dizer “Éden”?
descricao: >-
  Este é talvez o único trecho em que o Éden, como lugar, aparece distinto
  do jardim plantado nele. Friedrich Delitzsch e Schrader derivaram o nome
  do acádio edinu, “planície” ou “estepe”. Skinner (1910) aceita a
  comparação, mas acha precário concluir daí que o jardim fosse imaginado
  como um oásis no meio do deserto.
fontes:
  - nivel: 2
    descricao: >-
