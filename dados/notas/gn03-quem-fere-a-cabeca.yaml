id: gn03-quem-fere-a-cabeca
tipo: traducao
passagem: gen-03-01_03-24
versiculos:
  - 15
  - 15
titulo: Quem fere a cabeça da serpente?
descricao: >-
  No hebraico, quem fere a cabeça da serpente é a descendência da mulher, e
  o pronome está no masculino. Skinner (1910) observa que ele pode valer
  para o conjunto dessa descendência ou para um indivíduo dela, e que a
  gramática não autoriza, por si só, a leitura que o aplica a uma pessoa
  específica. A Vulgata latina abriu outro caminho ao trazer ipsa, “ela”,
  que põe a própria mulher como quem fere — leitura que, segundo Skinner,
  não aparece nos Padres antes de Ambrósio e Agostinho, e que o próprio
  Jerônimo sabia não ser a correta. Foi dela que veio, na Idade Média, a
  aplicação do versículo a Maria. A leitura cristológica é mais antiga e
  vem de Irineu, no século II; Lutero recusou a aplicação mariana mas viu
  ali uma alusão ao nascimento virginal, e Calvino leu a vitória como sendo
  da humanidade unida a Cristo. Skinner conclui que, pela exegese histórica
  estrita, é duvidoso que o versículo seja em algum sentido um
  “protoevangelho”. Em português a Bíblia Livre diz “esta te ferirá a
  cabeça”: o feminino aqui concorda com “descendência”, palavra feminina na
  língua, e não retoma a mulher como faz o ipsa latino.
leituras:
  - leitura: A descendência da mulher, no masculino, entendida como conjunto ou como indivíduo
    quem: O hebraico, conforme Skinner (1910, pp. 79–80), para quem a gramática não sustenta sozinha a aplicação a uma pessoa
  - leitura: A própria mulher (“ipsa”), de onde vem a aplicação a Maria
    quem: A Vulgata latina, conforme Skinner (1910, pp. 79 e 81), que a situa a partir de Ambrósio e Agostinho
  - leitura: Cristo
    quem: Irineu, no século II, conforme Skinner (1910, p. 81)
  - leitura: A humanidade unida a Cristo
    quem: Calvino, conforme Skinner (1910, p. 81)
fontes:
  - nivel: 2
    descricao: >-
      Skinner, J. (1910), A Critical and Exegetical Commentary on Genesis
      (International Critical Commentary), Nova York: Charles Scribner's
      Sons, pp. 79–81
    url: https://archive.org/details/criticalexegetic00skinuoft
notas: >-
  As versões antigas também divergem no verbo, que tanto pode ser esmagar
  quanto algo como espreitar ou investir: Áquila e Símaco puxam para um
  lado, a Peshitta e Jerônimo para outro (Skinner, 1910, p. 80). Isso é
  divergência de tradução entre versões, não variante de manuscrito
  hebraico.
trecho: esta te ferirá a cabeça
