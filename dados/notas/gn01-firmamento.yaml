id: gn01-firmamento
tipo: traducao
versiculos:
  - 6
  - 8
titulo: “Firmamento” ou “expansão”?
descricao: >-
  No segundo dia, Deus faz o raqia para separar as águas de cima das de
  baixo. Para Skinner (1910), a palavra designa a abóbada do céu, que os
  antigos entendiam como uma estrutura material, e não como ilusão de ótica;
  a ideia, diz ele, é de solidez. É por isso que a Septuaginta e a Vulgata
  dizem “firmamento”. A Bíblia Livre, como outras traduções modernas,
  prefere “expansão”.
leituras:
  - leitura: “Firmamento”, algo sólido
    quem: Septuaginta e Vulgata (Skinner 1910, p. 21; NETS, p. 6)
  - leitura: “Expansão”
    quem: A Bíblia Livre, entre outras traduções modernas
