id: gn04-o-sinal-de-caim
tipo: traducao
passagem: gen-04-01_04-26
versiculos:
  - 15
  - 15
titulo: O sinal de Caim protege, não condena
descricao: >-
  O texto diz que Deus pôs um sinal em Caim, e não diz que sinal era. O
  hebraico não o descreve em ponto nenhum, e a expressão admite duas
  construções: que Deus estabeleceu um sinal para Caim, ou que o marcou. O
  que o capítulo deixa claro é a finalidade, e ela é o oposto do que a
  expressão "marca de Caim" sugere no uso comum. Skinner (1910) diz com
  todas as letras que o propósito do sinal é proteger, não punir, e que
  tomá-lo como algo que marca Caim publicamente como assassino é uma ideia
  natural, porém equivocada. O sinal existe para que quem encontrasse Caim
  não o matasse — é salvo-conduto, não estigma.
leituras:
  - leitura: >-
      Algo visível no próprio Caim, que avisa a terceiros que matá-lo seria
      vingado sete vezes
    quem: Skinner (1910, p. 110), que considera esta a leitura exigida pelo contexto
  - leitura: >-
      Um sinal dado a Caim como penhor da promessa de Deus, à maneira dos
      sinais proféticos, e não algo gravado nele
    quem: Skinner (1910, p. 110) registra a leitura como coerente e a atribui a autoridades do Bereshit Rabbá e a Ibn Ezra
  - leitura: >-
      A marca tribal que cada homem trazia no corpo, sem a qual a vingança de
      sangue antiga não teria como funcionar
    quem: Leitura de W. Robertson Smith, relatada por Skinner (1910, p. 112) no excurso sobre a origem da lenda de Caim
fontes:
  - nivel: 2
    descricao: >-
      Skinner, J. (1910), A Critical and Exegetical Commentary on Genesis
      (International Critical Commentary), Nova York: Charles Scribner's
      Sons, pp. 110 e 112-114
    url: https://archive.org/details/criticalexegetic00skinuoft
notas: >-
  A terceira leitura vem junto de uma tese maior, que Skinner relata e
  examina no excurso das pp. 112-114: a de que a história de Caim guardaria
  memória dos queneus, clã que a Bíblia Hebraica retrata como nômade
  pastoril ao sul de Judá. Skinner aponta ele mesmo a dificuldade dessa
  leitura: os queneus aparecem quase sempre em boas relações com Israel e
  muito apegados ao culto de Javé, o que torna quase incrível, nas palavras
  dele, supô-los concebidos sob maldição especial. Fica pendente de
  conferência uma segunda fonte moderna para este versículo: Lohr, J. N.
  (2009), em Zeitschrift für die Alttestamentliche Wissenschaft 121, pp.
  101-103, que pela indexação trataria justamente da leitura do sinal como
  algo não gravado no corpo — não foi possível abrir o artigo nem na cópia
  aberta nem na do editor, então ele não entra como fonte.
trecho: pôs sinal em Caim
