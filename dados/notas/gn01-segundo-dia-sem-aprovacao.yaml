id: gn01-segundo-dia-sem-aprovacao
tipo: variante
versiculos:
  - 8
  - 8
titulo: O segundo dia sem “e viu Deus que era bom”
descricao: >-
  No texto hebraico padrão, o Texto Massorético, o segundo dia é o único ato
  da criação que não termina com “e viu Deus que era bom”. A Septuaginta, a
  tradução grega feita na Antiguidade, tem a frase. Um manuscrito de Qumran,
  4QGen-b, concorda com o hebraico padrão. Para Hendel (1998), o mais
  provável é que a frase tenha sido acrescentada ao texto hebraico que os
  tradutores gregos usavam, para deixar o segundo dia igual aos outros.
leituras:
  - leitura: Sem a frase
    quem: Texto Massorético e o manuscrito 4QGen-b (Hendel 1998, p. 23)
  - leitura: Com a frase
    quem: Septuaginta (NETS, p. 6)
