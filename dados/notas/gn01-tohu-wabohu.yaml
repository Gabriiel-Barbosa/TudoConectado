id: gn01-tohu-wabohu
tipo: traducao
versiculos:
  - 2
  - 2
titulo: O que é “tohu wabohu”?
descricao: >-
  O versículo 2 descreve a terra antes da criação com duas palavras
  hebraicas que rimam, tohu e bohu. O sentido exato é incerto: tohu vai do
  concreto “deserto” ao abstrato “nada”, e bohu talvez signifique “vazio”.
  As traduções antigas foram por caminhos diferentes. A Septuaginta grega
  diz que a terra era “invisível e sem forma”; a Bíblia Livre, que estava
  “desordenada e vazia”.
