id: gn03-teshuqah
tipo: traducao
passagem: gen-03-01_03-24
versiculos:
  - 16
  - 16
titulo: O “desejo” da mulher, uma palavra rara
descricao: >-
  A palavra hebraica traduzida por “desejo”, teshuqah, aparece só três
  vezes em toda a Bíblia hebraica, e por isso o sentido dela se apura mais
  por comparação que por uso. Skinner (1910) a aproxima de um termo árabe
  que significa desejo ardente. A Septuaginta grega verteu por algo mais
  fraco, na linha de “volta” ou “apego”, o que levou parte da crítica a
  propor corrigir o hebraico para uma palavra parecida que significaria
  “teu retorno”. Skinner recusa a correção e mantém “desejo”, mas nega que
  o versículo esteja dizendo que o desejo da mulher é maior que o do homem:
  para ele, o que está em jogo é um vínculo que a prende à condição dura
  que acabou de ser descrita. A discussão seguiu no século XX. Foh (1975)
  mostra que a tradução do termo é o próprio centro da dificuldade do
  versículo, e registra leituras concorrentes na bibliografia — desejo
  sexual intenso, dependência psicológica, e um desejo que Keil e Delitzsch
  chegaram a chamar de mórbido.
leituras:
  - leitura: Desejo ardente, que prende a mulher à condição descrita no versículo
    quem: Skinner (1910, pp. 82–83), que recusa a emenda do texto hebraico
  - leitura: Algo mais fraco, na linha de “volta” ou “retorno”
    quem: A Septuaginta grega, e os críticos que a partir dela propuseram emendar o hebraico, conforme Skinner (1910, p. 82)
  - leitura: Desejo sexual intenso, dependência psicológica ou desejo mórbido
    quem: Leituras concorrentes que Foh (1975, pp. 376–377) levanta na bibliografia
fontes:
  - nivel: 2
    descricao: >-
      Skinner, J. (1910), A Critical and Exegetical Commentary on Genesis
      (International Critical Commentary), Nova York: Charles Scribner's
      Sons, pp. 82–83
    url: https://archive.org/details/criticalexegetic00skinuoft
  - nivel: 2
    descricao: >-
      Foh, S. T. (1975), "What Is the Woman's Desire?", Westminster
      Theological Journal 37(3), pp. 376–377
notas: >-
  A nota registra as leituras que a bibliografia levanta, não a tese da
  própria Foh (1975) de que o desejo seria de dominar o marido, que é
  posição autoral dela naquele artigo e não consenso.
trecho: o teu desejo será para o teu marido
