titulo: Tehom, “o abismo”, e a Tiamat babilônica
descricao: >-
  A palavra traduzida por “abismo” no versículo 2, tehom, corresponde, na
  língua, ao nome Tiamat, a personificação das águas primordiais no mito
  babilônico da criação. Mesmo assim, Skinner (1910) observa que o relato
  hebraico não tem associações mitológicas e duvida que reste no nome algum
  traço de personificação.
fontes:
  - nivel: 2
    descricao: >-
