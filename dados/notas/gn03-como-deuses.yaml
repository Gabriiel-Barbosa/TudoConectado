id: gn03-como-deuses
tipo: traducao
passagem: gen-03-01_03-24
versiculos:
  - 5
  - 5
titulo: “Como Deus” ou “como deuses”?
descricao: >-
  A palavra hebraica elohim tem forma plural e pode designar tanto o Deus
  de Israel quanto seres divinos no plural. Por isso a promessa da serpente
  admite duas traduções: que os dois ficarão como Deus, ou que ficarão como
  deuses. Skinner (1910) defende a segunda, e considera que verter por
  “como anjos”, como fez Ibn Ezra, chega perto do sentido. Ele observa
  também que a semelhança com o divino que o texto concede ao ser humano
  não é igualdade com Javé. A Bíblia Livre, usada aqui, traduz no plural.
leituras:
  - leitura: “Como deuses”, ou seres divinos
    quem: Skinner (1910, p. 75), que também aceita “como anjos”, de Ibn Ezra, como aproximação
  - leitura: “Como Deus”, no singular
    quem: Leitura que Skinner (1910, p. 75) registra para recusá-la
fontes:
