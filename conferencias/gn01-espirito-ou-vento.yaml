    observacao: >-
      pp. 17–18: "The Spirit of God was brooding — not, as has sometimes been supposed, a wind sent
      from God to dry up the waters, but the divine Spirit"; p. 18: "It is impossible to say whether
      'brood' or 'hover' is the exact image here". Mais do que preferir, Skinner rejeita a leitura
      "vento".
