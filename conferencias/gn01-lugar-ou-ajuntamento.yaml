      texto integral e mapa de folha para página; a obra consta no catálogo da OUP
      (https://academic.oup.com/book/50213); folha 40 = p. 24
    observacao: >-
      A p. 24 confirma que G συναγωγήν corresponde a miqveh e não ao maqom do Texto Massorético, e
      que "the correctness of this retroversion is now confirmed in 4QGen[?]". O expoente que
      identifica o manuscrito está ilegível no OCR; a atribuição a 4QGen-h ficou sem verificação.
