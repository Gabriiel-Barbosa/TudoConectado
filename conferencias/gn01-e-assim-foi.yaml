      texto integral e mapa de folha para página; a obra consta no catálogo da OUP
      (https://academic.oup.com/book/50213); folhas 36–39 = pp. 20–23
    observacao: >-
      p. 20: "the harmonizations occurred in the Hebrew scribal traditions and are not attributable
      to the G translator"; p. 22: "The total in M is six ... seven".
