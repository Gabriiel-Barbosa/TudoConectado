    descricao: >-
      Skinner, J. (1910), A Critical and Exegetical Commentary on Genesis (International Critical
      Commentary), Nova York: Charles Scribner's Sons, pp. 57–58
    alegacao: >-
      Skinner (1910), pp. 57–58, atesta que neste trecho o Éden aparece como lugar distinto do
      jardim plantado nele, que Delitzsch e Schrader derivaram o nome do acádio edinu
      ("planície"/"estepe"), e que é precário concluir daí que o jardim fosse imaginado como um
      oásis no meio do deserto.
    veredito: confirmada
