    observacao: >-
      Texto: "This is perhaps the only place where Eden (as a geographical designation) is
      distinguished from the garden... It is derived by the younger Delitzsch and Schrader from
      Babylonian edinu, 'plain,' 'steppe,' or 'desert'... but it is a somewhat precarious inference
      that the garden was conceived as an oasis in the midst of a desert."
