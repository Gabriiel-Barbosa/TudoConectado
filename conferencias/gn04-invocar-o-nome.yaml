    observacao: >-
      As duas rodadas divergiram e fica gravado o veredito do Opus, conforme a regra. O Sonnet deu
      não confirmável parando no conteúdo, por a formulação sobre P estar na p. 136 e não na 137. O
      Opus confirmou: a p. 137 traz a explicação de J e prossegue com E e P, e as pp. 139-140 trazem
