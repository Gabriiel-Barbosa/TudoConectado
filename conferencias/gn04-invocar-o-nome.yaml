    descricao: >-
      Glisson, S. D. (1985/86), "Exodus 6:3 in Pentateuchal Criticism", Restoration Quarterly 28.3,
      pp. 137 e 139-140
    alegacao: >-
      Glisson resume, na p. 137, a explicação documentária de que a fonte J faz o culto a YHWH
      existir desde o princípio enquanto E e P reservam o nome à revelação a Moisés, e registra nas
      pp. 139-140 o dissenso de Mowinckel e de Cassuto a essa leitura.
    veredito: confirmada
    parou_em: null
    conferido_em: >-
