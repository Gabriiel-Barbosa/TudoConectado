    observacao: >-
      Dúvida VIII: "sumi possit vox Yom (dies), sive sensu proprio pro die naturali, sive sensu
      improprio pro quodam temporis spatio, deque huiusmodi quaestione libere inter exegetas
      disceptare liceat?" Resp. Affirmative. Na dúvida VII, a frase sobre o autor não pretender
