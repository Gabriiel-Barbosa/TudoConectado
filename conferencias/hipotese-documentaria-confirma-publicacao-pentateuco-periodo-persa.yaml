  - hash: 47617d719f01
    nivel: 2
    descricao: >-
      Wellhausen, J. (1885), Prolegomena to the History of Israel, trad. J. S. Black e A. Menzies,
      Edimburgo: A. & C. Black, cap. "The Oral and the Written Torah", pp. 405 e 408–409
    alegacao: >-
      Wellhausen (1885), pp. 405 e 408–409, atesta que o Pentateuco, do qual Gênesis faz parte, foi
      publicado pela primeira vez depois do exílio na Babilônia, no período persa.
    veredito: confirmada
    parou_em: null
    conferido_em: >-
      https://archive.org/details/bwb_C0-AVN-740 (fac-símile da edição de 1885, Edinburgh: Adam &
      Charles Black; busca de texto integral do item; cabeçalhos "THE ORAL AND THE WRITTEN TORAH.
      405 / 407 / 409" nas folhas 423, 425 e 427)
    observacao: >-
      p. 405: "The Priestly Code, worked into the Pentateuch… As such it was published and
      introduced in the year 444 B.C., a century after the exile"; Esdras vem "with a mandate from
      the Persian king". p. 408: "the remaining Torah of the Pentateuch—for there is no doubt that
      the law of Ezra was the whole Pentateuch—became known in the year 444 and was unknown till
      then". p. 409: "The introduction of the law, first Deuteronomy, and then the whole
      Pentateuch…". Ressalvas: o Deuteronômio é situado em 621 a.C., antes do exílio, então
      "publicado pela primeira vez depois do exílio" vale para o conjunto, não para cada parte;
      Gênesis não é citado nessas páginas ("do qual Gênesis faz parte" é acréscimo da alegação).
    data: '2026-09-18'
    conferido_por: contraprova
    revisao_humana: pendente
