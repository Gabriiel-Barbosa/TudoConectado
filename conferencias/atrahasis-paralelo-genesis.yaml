  - hash: 70cd6ba43d45
    nivel: 2
    descricao: >-
      Millard, A. R. (1967), "A New Babylonian 'Genesis' Story", Tyndale Bulletin 18, pp. 9–10 e
      15–16, doi:10.53751/001c.30683
    alegacao: >-
      Millard (1967), pp. 9–10 e 15–16, atesta que no poema babilônico Atrahasis o ser humano é
      formado de barro misturado à carne e ao sangue de um deus abatido, e que isso configura um
      paralelo com a formação do homem em Gênesis, em que o homem também recebe uma parte terrena e
      uma parte divina.
    veredito: confirmada
    parou_em: null
    conferido_em: >-
      PDF oficial de
      https://www.tyndalebulletin.org/article/30683-a-new-babylonian-genesis-story.pdf (doi
      10.53751/001c.30683), lido integralmente
    observacao: >-
      pp. 9–10: "Let them slaughter one god... With his flesh and blood / Let Nintu mix clay" e "Man
      was created from the flesh and blood of a slaughtered god mixed with clay", comparado a
      Gênesis 2:7 — "Man's earthy constituency is emphasized by both Babylonian and Hebrew
      narratives, and his divine part equally". pp. 15–16, seção "Man's constituency": "Both the
      Bible and some Babylonian Creation accounts depict man as created from 'the dust of the earth'
      or 'clay'. To this is added some divine component, 'breath' in Genesis, flesh and blood of a
      god... in Babylonia."
    data: '2026-09-19'
    conferido_por: contraprova
    revisao_humana: pendente
