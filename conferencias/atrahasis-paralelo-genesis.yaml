      (https://isac-assets.s3.amazonaws.com/isac-publications/misc_genesis.pdf); 2ª ed. de 1951
      confirmada no catálogo do Internet Archive (babyloniangenesi0000heid_r9d0)
    observacao: >-
      p. 67: "Let them slay a god... With his flesh and his blood / Let Ninhursag mix clay. / God
      and man / united(?) in the clay." pp. 118–119, seções "The creation of man" e "Old Testament
      parallels": Heidel resume as versões e, na nota 102 da p. 118, liga o episódio à Epopeia de
      Atrahasis, citando em seguida Gênesis 1:26-27 e 2:7 como comparação. A Contraprova não leu
