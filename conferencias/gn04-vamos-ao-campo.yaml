  - hash: 66e33aeaf5f3
    nivel: 2
    descricao: >-
      German, I. (2014), The Textual Unity of Genesis 2-4 against the Backdrop of the History of
      Exegesis, tese de doutorado, University of St. Michael's College / Toronto School of Theology,
      pp. 134-135
    alegacao: >-
      German registra que as principais versões antigas — Pentateuco Samaritano, Septuaginta,
      Vulgata e a síriaca — preenchem a lacuna textual do hebraico massorético em Gênesis 4:8
      acrescentando "vamos ao campo", e documenta que o Targum Neofiti traz uma expansão maior que
      começa por esse convite.
    veredito: confirmada
    parou_em: null
    conferido_em: >-
      https://utoronto.scholaris.ca/bitstream/1807/67425/1/German_Igal_201411_PhD_thesis.pdf
      (repositório institucional da Universidade de Toronto), marcadores de página impressos 134 e
      135 no texto extraído
    observacao: >-
      p. 134, literal: 'The major ancient versions fill the textual lacuna in the Hebrew reading of
      MT Gen 4:8... (so the Samaritan Pentateuch, LXX, Vulgate, Syriac). These versions add to Gen
      4:8: Let us go out to the field'. A nota 21, que começa na p. 134 e segue na 135, traz o
      Targum Neofiti citado a partir de McNamara (1992), pp. 65-67.
    data: '2026-09-24'
    conferido_por: contraprova
    revisao_humana: pendente
  - hash: 6ef6cd461175
    nivel: 2
    descricao: >-
      Efrati, S. (2023), "The Many Quarrels of Cain and Abel: A Targumic Expansion Reconsidered",
      Aramaic Studies 21.2, pp. 141-165, seções 2 e 4
    alegacao: >-
      Efrati registra que a tradição textual que põe "vamos ao campo" na boca de Caim está atestada
      na Septuaginta, no Pentateuco Samaritano e na Peshitta, considera provável que a cláusula seja
      adição secundária para resolver a dificuldade do hebraico, e relata que numa colação de cerca
      de 135 testemunhos do Targum Onkelos para este versículo apenas 16 trazem versão expandida ou
      interpolada.
    veredito: confirmada
    parou_em: null
    conferido_em: >-
      https://lirias.kuleuven.be/retrieve/cd700cc6-83fd-46c0-a474-6c9ab892b39d (repositório Lirias
      da KU Leuven), volume e páginas confirmados como Aramaic Studies 21.2, pp. 141-165, DOI
      10.1163/17455227-bja10046
    observacao: >-
      Os três elementos da alegação batem literalmente. A cópia é o manuscrito aceito pelo autor e
      não reproduz a paginação da revista, por isso a fonte indica seções e o intervalo de páginas
      da publicação, não a página de cada trecho.
