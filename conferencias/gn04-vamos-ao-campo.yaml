      https://archive.org/download/oldtestamenting01swet/oldtestamenting01swet_djvu.txt (Swete, vol.
      I, Cambridge University Press, 1887), página confirmada pelos números de rodapé: o bloco que
      cobre Gênesis 3:24b a 4:17, onde está o v. 8, termina na p. 6
    observacao: >-
      Texto literal: 'και είπεν Κάιν προς Αβελ τον αδελφόν αυτού Διέλθωμεν εις το πεδίον'. O OCR
      grafa Δ como Α, mas a leitura é inequívoca.
    data: '2026-09-24'
