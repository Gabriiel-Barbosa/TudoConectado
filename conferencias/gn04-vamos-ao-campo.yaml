ligacao: gn04-vamos-ao-campo
fontes:
  - hash: 3bfdc4b7c0ee
    nivel: 2
    descricao: >-
      Skinner, J. (1910), A Critical and Exegetical Commentary on Genesis (International Critical
      Commentary), Nova York: Charles Scribner's Sons, p. 107, com a chave das siglas das versões na
      lista de abreviaturas, p. xiii
    alegacao: >-
      Skinner afirma que a sentença de Gênesis 4:8 no hebraico é incompleta porque o verbo empregado
      nunca é inteiramente sinônimo do verbo de falar, e que as palavras que faltam, "vamos ao
      campo", devem ser supridas a partir do Pentateuco Samaritano, da Septuaginta, da Peshitta e da
      Vulgata.
    veredito: confirmada
    parou_em: null
    conferido_em: >-
      Exemplar digitalizado da Trinity College Library / Universidade de Toronto em
      https://archive.org/details/criticalexegetic00skinuoft, com as imagens das páginas lidas
      diretamente, sem OCR: p. 107 em
      https://archive.org/download/criticalexegetic00skinuoft/page/leaf209_w1600.jpg e a lista de
      abreviaturas, p. xiii, em
      https://archive.org/download/criticalexegetic00skinuoft/page/leaf27_w1600.jpg. Folha de rosto
      (leaf 12) confirma 'NEW YORK / CHARLES SCRIBNER'S SONS / 1910'
    observacao: >-
      Uma rodada anterior, sobre a mesma alegação com outro selo editorial, ficou em não confirmável
      parando no conteúdo, porque o OCR corrompeu as siglas em três extrações diferentes. A
      conferência foi refeita na imagem da página. O corpo do texto diz apenas 'must be supplied
      from Vns.; see below', e a nomeação das versões está na nota filológica ao pé da mesma p. 107,
      para onde o 'see below' remete: 'Hence nelkhah ha-sadeh is to be supplied with [quatro
      siglas], but not Aq.' A linha foi ampliada cerca de doze vezes e os quatro caracteres lidos um
      a um, e a chave da p. xiii dá Septuaginta, Peshitta, Recensão Samaritana do Pentateuco e
      Vulgata. As quatro versões conferem, sem sobras nem faltas. Armadilha registrada para quem
      reconferir: o volume tem duas páginas numeradas xiii, uma na Introdução (leaf 47) e outra na
      lista de abreviaturas (leaf 27), que é a citada aqui.
    data: '2026-09-24'
    conferido_por: contraprova
    revisao_humana: pendente
