    descricao: >-
      Speiser, E. A. (1964), Genesis: Introduction, Translation, and Notes (The Anchor Bible, vol.
      1), Garden City, NY: Doubleday, p. 28
    alegacao: >-
      Speiser registra que na tábua XI da Epopeia de Gilgamesh o herói obtém uma planta que oferece
      rejuvenescimento, e não imortalidade, e logo a perde para uma serpente, tratando o episódio
      como análogo mesopotâmico do motivo de Gênesis.
    veredito: confirmada
    parou_em: null
    conferido_em: >-
      mesma cópia digitalizada de Speiser, Genesis (Anchor Bible), extraída com pdftotext; marcador
      de página nativo "28 GENESIS § 3" localizado no texto
    observacao: >-
      Texto na p. 28: "he is permitted to take back with him a magic plant which offers the sop of
      rejuvenation (Tablet XI, line 282), if not the boon of immortality. But he is soon to be
      robbed of it - by a serpent." Corresponde exatamente à alegação. Mesma ressalva de edição da
      outra fonte de Speiser: exemplar conferido é a 3ª ed., 5ª tiragem, 1982, com copyright de
      1964.
