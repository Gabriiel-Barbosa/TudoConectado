    alegacao: >-
      Hendel (1998), p. 23, atesta que no Texto Massorético a fórmula de aprovação falta só no
      segundo dia, que a Septuaginta a tem em Gn 1:8, que 4QGen-b concorda com o Texto Massorético,
      e que o mais provável é um acréscimo harmonizador na tradição do texto usado pelos tradutores
      gregos.
