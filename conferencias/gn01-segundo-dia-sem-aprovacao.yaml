      texto integral e mapa de folha para página; a obra consta no catálogo da OUP
      (https://academic.oup.com/book/50213); folha 39 = p. 23
    observacao: >-
      p. 23: "The formula is lacking for only one act of creation, the creation of sky on the second
      day. The G reading of v 8 contains the expected approval formula ... more likely that the
      harmonizing tendency ... is responsible for this plus in proto-G". O expoente da sigla 4QGen
      saiu ilegível no OCR; lido como "b" pelo mesmo padrão no aparato.
