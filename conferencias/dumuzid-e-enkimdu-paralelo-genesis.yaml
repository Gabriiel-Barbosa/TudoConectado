    observacao: >-
      Texto confere quase literalmente. Ressalva de precisão: Westermann não cita nominalmente a
      composição c.4.08.33; ele discute o motivo a partir do cortejo de Inanna segundo Jacobsen,
      nomeando Dumuzi e Enkimdu. A ligação aponta para c.4.08.33 por ser onde o motivo se lê em
      edição aberta. Registrado no campo notas da ligação.
