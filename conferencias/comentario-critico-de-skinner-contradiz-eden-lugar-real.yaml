    observacao: >-
      p. 62, sob o cabeçalho "The site of paradise": "it is obvious that a real locality answering
      to the description of Eden exists and has existed nowhere on the face of the earth". As pp.
      59–61 trazem a exegese dos quatro rios e as pp. 63–66 percorrem e refutam as teorias de
      localização, concluindo na p. 66: "Gn. 2:10-14 is but one of many attempts to localise on
      earth a representation which is essentially mythical".
