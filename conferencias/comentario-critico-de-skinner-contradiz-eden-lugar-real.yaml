    alegacao: >-
      Skinner (1910), pp. 59–62 e 65–66, sustenta que o jardim do Éden descrito em Gênesis 2 não
      corresponde a um lugar real que se possa localizar no mapa, com base no exame da geografia dos
      quatro rios.
