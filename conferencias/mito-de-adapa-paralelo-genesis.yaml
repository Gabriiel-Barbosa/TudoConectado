    descricao: >-
      Buccellati, G. (1973), "Adapa, Genesis, and the Notion of Faith", Ugarit-Forschungen 5, pp.
      64–65
    alegacao: >-
      Buccellati registra semelhanças específicas entre Adapa e Adão, entre elas a proibição de
      comer certo alimento sob pena de morte, formulada de modo próximo ao de Gênesis, e apresenta
      isso como comparação, apontando também diferenças.
    veredito: confirmada
    parou_em: null
    conferido_em: >-
      PDF do artigo hospedado no arquivo institucional do autor (IIMAS/Urkesh),
      https://urkesh.org/EL2/Buccellati_1973_Adapa,_Genesis,_and_the_Notion_of_Faith%20-%20UF_5.pdf,
      extraído com pdftotext; cabeçalhos de página "64 Giorgio Buccellati" e "Adapa, Genesis, and
      the Notion of Faith 65" localizados no texto
    observacao: >-
      Texto exato, a cavaleiro das pp. 64–65: "(1) A first similarity is in the situation of the two
      men, since both are faced with the prohibition to partake of a certain food. The formulation
      of Ea's command is close to that of Genesis." O artigo também lista diferenças explícitas logo
      a seguir (ex.: "Admittedly, the sequence of events and the nature of the details is
      different"). Corresponde à alegação.
